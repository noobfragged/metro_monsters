  });
})();

/* ===== CANVAS RENDERER & DYNAMIC SKY THEMES ===== */
MetroMonsters.Renderer = (() => {
  let canvas = null;
  let ctx = null;

  function renderCityLandmarks(ctx, stageIndex, theme) {
    ctx.save();
    ctx.fillStyle = theme.silhouetteColor;
    const roadY = MetroMonsters.Constants.VIEWPORT.ROAD_Y;

    // Standard city skyline base
    for (let i = 0; i < 18; i++) {
      const bx = i * 76;
      const bh = 110 + ((i * 41 + stageIndex * 23) % 100);
      ctx.fillRect(bx, roadY - bh, 56, bh);
    }

    // Custom Iconic Landmark Silhouette per City!
    const city = (MetroMonsters.Constants.STAGES[stageIndex % MetroMonsters.Constants.STAGES.length].cityName || "").toUpperCase();

    if (city.includes("CHICAGO")) {
      // Willis (Sears) Tower with Twin Antennas
      ctx.fillRect(600, roadY - 320, 80, 320);
      ctx.fillRect(615, roadY - 360, 50, 40);
      ctx.fillRect(625, roadY - 390, 30, 30);
      ctx.fillRect(630, roadY - 440, 4, 50); // Left antenna
      ctx.fillRect(646, roadY - 440, 4, 50); // Right antenna
    } else if (city.includes("NEW YORK")) {
      // Empire State Building Needle Spire
      ctx.fillRect(620, roadY - 300, 70, 300);
      ctx.fillRect(635, roadY - 360, 40, 60);
      ctx.fillRect(645, roadY - 420, 20, 60);
      ctx.fillRect(653, roadY - 470, 4, 50); // Needle tip
    } else if (city.includes("LOS ANGELES")) {
      // Hollywood Hills Contour & Palm Trees
      ctx.beginPath();
      ctx.moveTo(0, roadY - 60);
      ctx.quadraticCurveTo(320, roadY - 180, 640, roadY - 90);
      ctx.quadraticCurveTo(960, roadY - 200, 1280, roadY - 70);
      ctx.lineTo(1280, roadY);
      ctx.lineTo(0, roadY);
      ctx.fill();

      // Palm Trees
      [140, 420, 860, 1140].forEach(px => {
        ctx.fillRect(px, roadY - 140, 8, 140);
        ctx.beginPath();
        ctx.arc(px + 4, roadY - 140, 28, 0, Math.PI * 2);
        ctx.fill();
      });
    } else if (city.includes("SAN FRANCISCO")) {
      // Golden Gate Bridge Suspension Towers & Cables
      ctx.fillRect(240, roadY - 260, 24, 260);
      ctx.fillRect(800, roadY - 260, 24, 260);
      ctx.strokeStyle = theme.silhouetteColor;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, roadY - 180);
      ctx.quadraticCurveTo(252, roadY - 260, 520, roadY - 120);
      ctx.quadraticCurveTo(812, roadY - 260, 1280, roadY - 180);
      ctx.stroke();
    } else if (city.includes("TOKYO")) {
      // Tokyo Tower Red Lattice Spire & Mt. Fuji Cone
      ctx.beginPath();
      ctx.moveTo(100, roadY);
      ctx.lineTo(340, roadY - 220);
      ctx.lineTo(580, roadY);
      ctx.fill();

      // Tokyo Tower Lattice
      ctx.beginPath();
      ctx.moveTo(880, roadY);
      ctx.lineTo(940, roadY - 420);
      ctx.lineTo(1000, roadY);
      ctx.fill();
      ctx.fillRect(920, roadY - 240, 40, 20);
    } else if (city.includes("SEATTLE")) {
      // Space Needle Disc & Spire
      ctx.fillRect(630, roadY - 380, 16, 380);
      ctx.beginPath();
      ctx.ellipse(638, roadY - 340, 48, 16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(636, roadY - 420, 4, 40); // Spire tip
    } else if (city.includes("LAS VEGAS")) {
      // Luxor Pyramid & High-Roller Ferris Wheel
      ctx.beginPath();
      ctx.moveTo(140, roadY);
      ctx.lineTo(320, roadY - 240);
      ctx.lineTo(500, roadY);
      ctx.fill();

      // Ferris Wheel
      ctx.lineWidth = 5;
      ctx.strokeStyle = theme.silhouetteColor;
      ctx.beginPath();
      ctx.arc(920, roadY - 180, 100, 0, Math.PI * 2);
      ctx.stroke();
    } else if (city.includes("LONDON")) {
      // Big Ben Gothic Clock Tower & Clock Face
      ctx.fillRect(600, roadY - 340, 64, 340);
      ctx.beginPath();
      ctx.moveTo(590, roadY - 340);
      ctx.lineTo(632, roadY - 430);
      ctx.lineTo(674, roadY - 340);
      ctx.fill();
      ctx.fillStyle = theme.moonColor;
      ctx.beginPath();
      ctx.arc(632, roadY - 300, 14, 0, Math.PI * 2);
      ctx.fill();
    } else if (city.includes("PARIS")) {
      // Eiffel Tower Lattice Spire & Sweep Beacon Light
      ctx.beginPath();
      ctx.moveTo(520, roadY);
      ctx.lineTo(640, roadY - 440);
      ctx.lineTo(760, roadY);
      ctx.fill();
      ctx.fillRect(600, roadY - 260, 80, 20);

      // Arc de Triomphe
      ctx.fillRect(180, roadY - 140, 120, 140);
      ctx.clearRect(220, roadY - 80, 40, 80);
    } else if (city.includes("RIO")) {
      // Corcovado Mountain Peak & Christ the Redeemer Statue
      ctx.beginPath();
      ctx.moveTo(400, roadY);
      ctx.lineTo(640, roadY - 260);
      ctx.lineTo(880, roadY);
      ctx.fill();

      // Christ Statue Outstretched Arms Silhouette
      ctx.fillRect(635, roadY - 320, 10, 60);
      ctx.fillRect(610, roadY - 310, 60, 8);
        } else if (city.includes("CAIRO")) {
      // Three Great Pyramids of Giza
      ctx.beginPath();
      ctx.moveTo(80, roadY); ctx.lineTo(320, roadY - 220); ctx.lineTo(560, roadY);
      ctx.moveTo(440, roadY); ctx.lineTo(680, roadY - 260); ctx.lineTo(920, roadY);
      ctx.moveTo(820, roadY); ctx.lineTo(1020, roadY - 180); ctx.lineTo(1220, roadY);
      ctx.fill();
    } else if (city.includes("TORONTO")) {
      // CN Tower Needle & Rogers Centre Dome
      ctx.fillRect(630, roadY - 420, 16, 420);
      ctx.beginPath(); ctx.ellipse(638, roadY - 360, 40, 14, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(636, roadY - 470, 4, 50);
      ctx.beginPath(); ctx.arc(280, roadY, 80, Math.PI, 0); ctx.fill();
    } else if (city.includes("MONTERREY")) {
      // Cerro de la Silla Saddle Mountain & Faro del Comercio Spire
      ctx.beginPath();
      ctx.moveTo(0, roadY); ctx.lineTo(280, roadY - 240); ctx.lineTo(500, roadY - 160); ctx.lineTo(760, roadY - 280); ctx.lineTo(1100, roadY);
      ctx.fill();
      ctx.fillRect(920, roadY - 340, 14, 340);
    } else if (city.includes("MOSCOW")) {
      // Saint Basil's Cathedral Onion Domes & Kremlin Towers
      [240, 480, 800, 1020].forEach((kx, idx) => {
        ctx.fillRect(kx, roadY - 220, 48, 220);
        ctx.beginPath(); ctx.arc(kx + 24, roadY - 250, 20 + (idx % 2)*6, 0, Math.PI * 2); ctx.fill();
        ctx.fillRect(kx + 22, roadY - 290, 4, 40);
      });
    } else if (city.includes("JOHANNESBURG")) {
      // Hillbrow Telkom Tower Pod & Ponte City Cylinder
      ctx.fillRect(630, roadY - 420, 14, 420);
      ctx.beginPath(); ctx.ellipse(637, roadY - 350, 32, 16, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(280, roadY - 320, 70, 320);
    } else if (city.includes("KUWAIT")) {
      // Kuwait Spherical Spire Towers
      ctx.fillRect(630, roadY - 430, 12, 430);
      ctx.beginPath(); ctx.arc(636, roadY - 310, 28, 0, Math.PI * 2); ctx.arc(636, roadY - 380, 16, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(820, roadY - 320, 8, 320);
      ctx.beginPath(); ctx.arc(824, roadY - 240, 18, 0, Math.PI * 2); ctx.fill();
    } else if (city.includes("MUMBAI")) {
      // Gateway of India Stone Archway & Bandra-Worli Sea Link Towers
      ctx.fillRect(520, roadY - 220, 160, 220);
      ctx.clearRect(570, roadY - 140, 60, 140);
      ctx.beginPath(); ctx.moveTo(140, roadY); ctx.lineTo(240, roadY - 320); ctx.lineTo(340, roadY); ctx.fill();
    } else if (city.includes("MELBOURNE")) {
      // Eureka Tower Gold Crown & Royal Exhibition Building Dome
      ctx.fillRect(620, roadY - 380, 60, 380);
      ctx.fillRect(610, roadY - 410, 80, 30); // Gold crown top
      ctx.beginPath(); ctx.arc(320, roadY - 180, 60, Math.PI, 0); ctx.fill();
    } else if (city.includes("AUCKLAND")) {
      // Sky Tower Pod & Needle
      ctx.fillRect(630, roadY - 430, 14, 430);
      ctx.beginPath(); ctx.ellipse(637, roadY - 350, 42, 14, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(635, roadY - 470, 4, 40);
    } else if (city.includes("SYDNEY")) {
      // Sydney Opera House Sails & Harbour Bridge Arch
      ctx.beginPath();
      ctx.moveTo(160, roadY); ctx.lineTo(240, roadY - 140); ctx.lineTo(320, roadY);
      ctx.moveTo(260, roadY); ctx.lineTo(340, roadY - 180); ctx.lineTo(420, roadY);
      ctx.fill();
      ctx.lineWidth = 6; ctx.strokeStyle = theme.silhouetteColor;
      ctx.beginPath(); ctx.arc(860, roadY, 180, Math.PI, Math.PI * 2); ctx.stroke();
    } else if (city.includes("SHANGHAI")) {
      // Oriental Pearl Tower Double Spheres & Shanghai Tower Spiral
      ctx.fillRect(630, roadY - 420, 14, 420);
      ctx.beginPath();
      ctx.arc(637, roadY - 220, 36, 0, Math.PI * 2);
      ctx.arc(637, roadY - 340, 22, 0, Math.PI * 2);
      ctx.fill();
    } else if (city.includes("SINGAPORE")) {
      // Marina Bay Sands 3 Towers & Surfboard Sky Park Roof
      ctx.fillRect(520, roadY - 280, 45, 280);
      ctx.fillRect(600, roadY - 280, 45, 280);
      ctx.fillRect(680, roadY - 280, 45, 280);
      // Surfboard SkyPark
      ctx.fillRect(490, roadY - 300, 260, 20);
    } else if (city.includes("DUBAI")) {
      // Burj Khalifa Ultra-Tall Stepped Mega Spire
      ctx.fillRect(610, roadY - 260, 80, 260);
      ctx.fillRect(625, roadY - 340, 50, 80);
      ctx.fillRect(635, roadY - 420, 30, 80);
      ctx.fillRect(647, roadY - 480, 6, 60); // Needle top
    } else if (city.includes("HONG KONG")) {
      // Victoria Peak Mountain & Bank of China Triangular Spire
      ctx.beginPath();
      ctx.moveTo(0, roadY);
      ctx.lineTo(380, roadY - 320);
      ctx.lineTo(820, roadY - 180);
      ctx.lineTo(1280, roadY - 280);
      ctx.lineTo(1280, roadY); ctx.lineTo(0, roadY);
      ctx.fill();

      // Bank of China Spire
      ctx.fillRect(840, roadY - 420, 16, 420);
      ctx.beginPath();
      ctx.moveTo(810, roadY); ctx.lineTo(848, roadY - 400); ctx.lineTo(886, roadY);
      ctx.fill();
    }

    ctx.restore();
  }

  return Object.freeze({
    init: (canvasEl) => {
      canvas = canvasEl;
      ctx = canvas.getContext("2d");
    },
    clear: (stageIndex = 0) => {
      const stage = MetroMonsters.Constants.STAGES[stageIndex % MetroMonsters.Constants.STAGES.length];
      const theme = stage.skyTheme;

      // Dynamic City Sky Gradient
      const grad = ctx.createLinearGradient(0, 0, 0, MetroMonsters.Constants.VIEWPORT.ROAD_Y);
      grad.addColorStop(0, theme.top);
      grad.addColorStop(0.45, theme.mid);
      grad.addColorStop(1, theme.bottom);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, MetroMonsters.Constants.VIEWPORT.WIDTH, MetroMonsters.Constants.VIEWPORT.ROAD_Y);

      // Moon / Sun Rendering
      ctx.save();
      ctx.fillStyle = theme.moonColor;
      ctx.beginPath();
      ctx.arc(1060, 90, 28, 0, Math.PI * 2);
      ctx.fill();
      if (theme.moonType === "crescent") {
        ctx.fillStyle = theme.top;
        ctx.beginPath();
        ctx.arc(1072, 84, 24, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // Dynamic City Landmark Scenery Backgrounds!
      renderCityLandmarks(ctx, stageIndex, theme);
    },
    renderRoad: () => {
      if (!ctx) return;
      // ROAD SURFACE & SIDEWALK (Renders over building base, beneath entities & monsters)
      ctx.fillStyle = "#334155";
      ctx.fillRect(0, MetroMonsters.Constants.VIEWPORT.ROAD_Y - 10, MetroMonsters.Constants.VIEWPORT.WIDTH, 140);
      ctx.fillStyle = "#f59e0b";
      for (let x = 20; x < MetroMonsters.Constants.VIEWPORT.WIDTH; x += 60) {
        ctx.fillRect(x, MetroMonsters.Constants.VIEWPORT.ROAD_Y + 40, 32, 6);
      }
      ctx.fillStyle = "#64748b";
      ctx.fillRect(0, MetroMonsters.Constants.VIEWPORT.ROAD_Y - 10, MetroMonsters.Constants.VIEWPORT.WIDTH, 4);
    },
    getCtx: () => ctx
  });
})();

/* ===== GAME STATE STORE & MAIN LOOP ===== */
MetroMonsters.Engine = (() => {
  let state = "TITLE";
  let p1Monster = null;
  let p2Monster = null;
  let currentStageIndex = 0;
  let stageClearTimer = 0;

  function update() {
    if (MetroMonsters.Input.wasPausePressed()) {
      if (state === "PLAYING") {
        state = "PAUSED";
        MetroMonsters.Input.clearPressed();
        return;
      } else if (state === "PAUSED") {
        state = "PLAYING";
        MetroMonsters.Input.clearPressed();
        return;
      }
    }

    if (state === "PAUSED") {
      MetroMonsters.Audio.updateMusic(currentStageIndex, false);
      return;
    }

    if (state === "TITLE") {
      MetroMonsters.UI.updateTitle();
      if (MetroMonsters.Input.isConfirmPressed(1)) {
        MetroMonsters.Audio.playTone(520, 'square', 0.12, 0.3);
        state = "SELECT";
        MetroMonsters.Input.clearPressed();
      }
    } else if (state === "SELECT") {
      MetroMonsters.UI.updateSelectLobby();

      const p1Input = MetroMonsters.Input.getPlayerInput(1);
      const p2Input = MetroMonsters.Input.getPlayerInput(2);
      const isConfirmKey = p1Input.wasPressed.punch || p1Input.wasPressed.jump || p2Input.wasPressed.punch || p2Input.wasPressed.jump;

      if (isConfirmKey || MetroMonsters.Input.isConfirmPressed(1) || MetroMonsters.Input.isConfirmPressed(2)) {
        const chosen = MetroMonsters.UI.getSelectedRoster();
        const is2P = MetroMonsters.UI.getGameMode() === 2;
        currentStageIndex = 0;
        p1Monster = new MetroMonsters.Entities.Monster(1, chosen.p1, false);
        p2Monster = is2P ? new MetroMonsters.Entities.Monster(2, chosen.p2, false) : null;
        MetroMonsters.BuildingManager.loadStage(currentStageIndex);
        MetroMonsters.AIDirector.init(currentStageIndex);
        MetroMonsters.Audio.playRoar();
        state = "PLAYING";
        MetroMonsters.Input.clearPressed();
      }
    } else if (state === "PLAYING") {
      MetroMonsters.Audio.updateMusic(currentStageIndex, true);
      const activeMonsters = [p1Monster, p2Monster].filter(Boolean);
      MetroMonsters.BuildingManager.update();
      MetroMonsters.AIDirector.update(activeMonsters);
      if (p1Monster) p1Monster.update();
      if (p2Monster) p2Monster.update();
      MetroMonsters.VFX.update();

      if (MetroMonsters.BuildingManager.areAllBuildingsDestroyed()) {
        const totalStages = MetroMonsters.Constants.STAGES.length;
        if (currentStageIndex >= totalStages - 1) {
          // Cleared final boss city (Day 15: HONG KONG, CHINA)!
          state = "VICTORY";
          stageClearTimer = 360;
          MetroMonsters.Audio.playRoar();
          if (p1Monster && p1Monster.isAlive) p1Monster.score += 10000;
          if (p2Monster && p2Monster.isAlive) p2Monster.score += 10000;
        } else {
          state = "STAGE_CLEAR";
          stageClearTimer = 180;
          MetroMonsters.Audio.playRoar();
          if (p1Monster && p1Monster.isAlive) p1Monster.score += 2000;
          if (p2Monster && p2Monster.isAlive) p2Monster.score += 2000;
        }
      }
    } else if (state === "STAGE_CLEAR") {
      MetroMonsters.Audio.updateMusic(currentStageIndex, false);
      stageClearTimer--;
      MetroMonsters.VFX.update();
      if (stageClearTimer <= 0) {
        currentStageIndex++;
        MetroMonsters.BuildingManager.loadStage(currentStageIndex);
        MetroMonsters.AIDirector.init(currentStageIndex);

        if (p1Monster) {
          p1Monster.x = 280;
          p1Monster.y = MetroMonsters.Constants.VIEWPORT.ROAD_Y;
          p1Monster.isClimbing = false;
          p1Monster.attachedBuilding = null;
        }
        if (p2Monster) {
          p2Monster.x = 720;
          p2Monster.y = MetroMonsters.Constants.VIEWPORT.ROAD_Y;
          p2Monster.isClimbing = false;
          p2Monster.attachedBuilding = null;
        }

        MetroMonsters.Audio.playRoar();
        state = "PLAYING";
      }
    } else if (state === "VICTORY") {
      MetroMonsters.Audio.updateMusic(currentStageIndex, false);
      stageClearTimer--;
      if (Math.random() < 0.35) {
        MetroMonsters.VFX.spawnExplosion(MetroMonsters.Utils.randomRange(100, 1180), MetroMonsters.Utils.randomRange(100, 400));
      }
      MetroMonsters.VFX.update();
      if (stageClearTimer <= 0 || MetroMonsters.Input.isConfirmPressed(1) || MetroMonsters.Input.isConfirmPressed(2)) {
        state = "TITLE";
      }
    } else {
      MetroMonsters.Audio.updateMusic(currentStageIndex, false);
    }
  }

  function render() {
    const ctx = MetroMonsters.Renderer.getCtx();
    if (!ctx) return;

    if (state === "TITLE") {
      MetroMonsters.UI.renderTitle(ctx);
    } else if (state === "SELECT") {
      MetroMonsters.UI.renderSelectLobby(ctx);
    } else if (state === "PLAYING" || state === "STAGE_CLEAR" || state === "VICTORY" || state === "PAUSED") {
      MetroMonsters.Renderer.clear(currentStageIndex);
      MetroMonsters.BuildingManager.render(ctx);
      MetroMonsters.Renderer.renderRoad();
      MetroMonsters.AIDirector.render(ctx);
      if (p1Monster) p1Monster.render(ctx);
      if (p2Monster) p2Monster.render(ctx);
      MetroMonsters.VFX.render(ctx);
      MetroMonsters.UI.renderHUD(ctx, p1Monster, p2Monster, currentStageIndex);

      if (state === "STAGE_CLEAR") {
        MetroMonsters.UI.renderStageClear(ctx, currentStageIndex);
      } else if (state === "VICTORY") {
        MetroMonsters.UI.renderVictory(ctx, p1Monster, p2Monster);
      } else if (state === "PAUSED") {
        MetroMonsters.UI.renderPause(ctx);
      }
    }
  }

  function loop() {
    try {
      update();
      render();
    } catch (err) {
      console.error("Engine Loop Exception:", err);
    }
    MetroMonsters.Input.clearPressed();
    requestAnimationFrame(loop);
  }

  return Object.freeze({
    start: () => { requestAnimationFrame(loop); },
    togglePause: () => {
      if (state === "PLAYING") state = "PAUSED";
      else if (state === "PAUSED") state = "PLAYING";
    }
  });
})();

/* ===== BOOTSTRAP INITIALIZATION ===== */
MetroMonsters.Bootstrap = (() => {
  function fitCanvas() {
    const wrapper = document.getElementById("game-wrapper");
    if (!wrapper) return;

    const targetW = 1280;
    const targetH = 720;
    const targetAspect = targetW / targetH;

    // Use full inner viewport bounds (accounting for fullscreen mode and window resize)
    const winW = window.innerWidth;
    const winH = window.innerHeight;

    // Strictly enforce 16:9 aspect ratio scaling with letterboxing / pillarboxing!
    let fitW = winW;
    let fitH = winW / targetAspect;

    if (fitH > winH) {
      fitH = winH;
      fitW = winH * targetAspect;
    }

    const scale = fitW / targetW;
    wrapper.style.transform = `scale(${scale})`;
  }

  window.addEventListener("DOMContentLoaded", () => {
    const canvas = document.getElementById("game-canvas");
    MetroMonsters.Renderer.init(canvas);

    fitCanvas();
    window.addEventListener("resize", fitCanvas);
    document.addEventListener("fullscreenchange", fitCanvas);
    window.addEventListener("orientationchange", () => { setTimeout(fitCanvas, 100); });

    document.getElementById("fullscreen-btn").addEventListener("click", () => {
      const target = document.documentElement;
      if (!document.fullscreenElement) {
        if (target.requestFullscreen) target.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      }
    });

    const pauseBtn = document.getElementById("pause-btn");
    if (pauseBtn) {
      pauseBtn.addEventListener("click", () => {
        MetroMonsters.Engine.togglePause();
      });
    }

    const crtOverlay = document.getElementById("crt-overlay");
    const crtBtn = document.getElementById("crt-toggle-btn");
    crtBtn.addEventListener("click", () => {
      crtOverlay.classList.toggle("disabled");
      crtBtn.textContent = crtOverlay.classList.contains("disabled") ? "CRT: OFF" : "CRT: ON";
    });

    const sfxBtn = document.getElementById("sfx-toggle-btn");
    if (sfxBtn) {
      sfxBtn.addEventListener("click", () => {
        MetroMonsters.Constants.AUDIO.SFX_ENABLED = !MetroMonsters.Constants.AUDIO.SFX_ENABLED;
        sfxBtn.textContent = MetroMonsters.Constants.AUDIO.SFX_ENABLED ? "SOUNDS: ON" : "SOUNDS: OFF";
      });
    }

    const musicBtn = document.getElementById("music-toggle-btn");
    if (musicBtn) {
      musicBtn.addEventListener("click", () => {
        MetroMonsters.Constants.AUDIO.MUSIC_ENABLED = !MetroMonsters.Constants.AUDIO.MUSIC_ENABLED;
        musicBtn.textContent = MetroMonsters.Constants.AUDIO.MUSIC_ENABLED ? "MUSIC: ON" : "MUSIC: OFF";
      });
    }

    MetroMonsters.Engine.start();
  });
})();
</script>
