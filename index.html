:root {

* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #030712; font-family: var(--font-arcade); color: #fff; }

body {
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at center, #111827 0%, #030712 100%);
  touch-action: none;
}

#game-wrapper {
  position: relative;
  width: 1280px;
  height: 720px;
  display: flex;
  justify-content: center;
  align-items: center;
  transform-origin: center center;
  flex-shrink: 0;
}

#game-container {
  position: relative;
  width: 1280px;
  height: 720px;
  aspect-ratio: 16 / 9;
  background: #000;
  border: 4px solid #1e293b;
  border-radius: 8px;
  box-shadow: 0 0 60px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 204, 0, 0.15);
  overflow: hidden;
  cursor: pointer;
}

canvas#game-canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* CRT Scanline Shader Overlay */
#crt-overlay {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
  z-index: 10;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, 0.18) 0px,
    rgba(0, 0, 0, 0.18) 1px,
    transparent 1px,
    transparent 3px
  );
  box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.7);
  transition: opacity 0.3s;
}

#crt-overlay.disabled { opacity: 0; }

.top-controls {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 25;
  display: flex;
  gap: 8px;
}

.arcade-btn {
  background: rgba(15, 23, 42, 0.88);
  border: 1.5px solid #475569;
  color: #e2e8f0;
  font-family: var(--font-arcade);
  font-size: 11px;
  font-weight: bold;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: all 0.15s ease;
  box-shadow: 0 4px 8px rgba(0,0,0,0.4);
}

.arcade-btn:hover {
  border-color: var(--gold);
  color: #fff;
  transform: translateY(-1px);
}

  }

  // unlocking web audio context before Chrome yells at me again
  window.addEventListener("pointerdown", initCtx, { once: false });
  window.addEventListener("keydown", initCtx, { once: false });

    if (!MetroMonsters.Constants.AUDIO.SFX_ENABLED) return;
    initCtx();
    if (!ctx) return;
    try {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(vol * MetroMonsters.Constants.AUDIO.MASTER_VOLUME, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch (e) {}
  }

  function playNoise(duration, vol = 0.15) {
    if (!MetroMonsters.Constants.AUDIO.SFX_ENABLED) return;
    initCtx();
    if (!ctx) return;
    try {
      const bufferSize = ctx.sampleRate * duration;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(vol * MetroMonsters.Constants.AUDIO.MASTER_VOLUME, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      noise.connect(gain);
      gain.connect(ctx.destination);
      noise.start();
    } catch (e) {}
  }

    updateMusic: (stageIndex, isPlaying) => {

          musicTimer = null;

        currentMusicStage = -1;
        return;

      initCtx();
      if (!ctx) return;

      if (currentMusicStage !== stageIndex || !musicTimer) {
        if (musicTimer) clearInterval(musicTimer);
        currentMusicStage = stageIndex;
        musicStep = 0;

        const track = STAGE_MUSIC_TRACKS[stageIndex % STAGE_MUSIC_TRACKS.length];

        musicTimer = setInterval(() => {
          if (!MetroMonsters.Constants.AUDIO.MUSIC_ENABLED) return;
          initCtx();
          if (!ctx) return;

            const now = ctx.currentTime;

            const bGain = ctx.createGain();
            bOsc.type = "triangle";

            bGain.gain.linearRampToValueAtTime(0.001, now + 0.14);
            bOsc.connect(bGain);
            bGain.connect(ctx.destination);
            bOsc.start(now);
            bOsc.stop(now + 0.15);

            if (musicStep % 2 === 0) {

              const lGain = ctx.createGain();
              lOsc.type = "square";
              lOsc.frequency.setValueAtTime(lFreq, now);
              lGain.gain.setValueAtTime(0.16 * MetroMonsters.Constants.AUDIO.MASTER_VOLUME, now);
              lGain.gain.linearRampToValueAtTime(0.001, now + 0.20);
              lOsc.connect(lGain);
              lGain.connect(ctx.destination);
              lOsc.start(now);
              lOsc.stop(now + 0.21);
            }

            musicStep++;
          } catch (e) {}
        }, stepMs);
      }
    },
    updateRotorSound: (helicopters) => {
      if (!MetroMonsters.Constants.AUDIO.SFX_ENABLED) {
        if (rotorGain) rotorGain.gain.value = 0;
        return;
      }
      initCtx();
      if (!ctx) return;

      const hasHelicopter = helicopters && helicopters.some(h => h && h.alive);
      if (hasHelicopter) {
        if (!isRotorActive) {
          try {
            isRotorActive = true;
            // 55 Hz sawtooth main rotor tone
            rotorOsc = ctx.createOscillator();
            rotorOsc.type = "sawtooth";
            rotorOsc.frequency.setValueAtTime(55, ctx.currentTime);

            // 13 Hz square wave pulse chopper modulator
            rotorLfo = ctx.createOscillator();
            rotorLfo.type = "square";
            rotorLfo.frequency.setValueAtTime(13, ctx.currentTime);

            // Lowpass filter for deep rhythmic thrum
            const filter = ctx.createBiquadFilter();
            filter.type = "lowpass";
            filter.frequency.setValueAtTime(360, ctx.currentTime);

            // Dedicated gain node for the chopper modulation signal path
            const chopGain = ctx.createGain();
            chopGain.gain.setValueAtTime(0.5, ctx.currentTime);

            rotorGain = ctx.createGain();
            const targetVol = 0.22 * MetroMonsters.Constants.AUDIO.MASTER_VOLUME;
            rotorGain.gain.setValueAtTime(0.01, ctx.currentTime);
            rotorGain.gain.linearRampToValueAtTime(targetVol, ctx.currentTime + 0.2);

            // Bulletproof Signal flow: rotorOsc -> chopGain (modulated by 13Hz rotorLfo) -> filter -> rotorGain -> destination
            rotorOsc.connect(chopGain);
            rotorLfo.connect(chopGain.gain);
            chopGain.connect(filter);
            filter.connect(rotorGain);
            rotorGain.connect(ctx.destination);

            rotorOsc.start();
            rotorLfo.start();
          } catch (e) {}
        }
      } else {
        if (isRotorActive && rotorGain) {
          try {
            rotorGain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.2);
            setTimeout(() => {
              if (rotorOsc) {
                try { rotorOsc.stop(); rotorLfo.stop(); } catch(e){}
              }
              isRotorActive = false;
            }, 250);
          } catch (e) {}
        }
      }
    },
    playTone,
    playPunch: () => {
      playTone(140, 'square', 0.08, 0.3);
      playNoise(0.06, 0.25);
    },
    playJump: () => {
      if (!MetroMonsters.Constants.AUDIO.ENABLED) return;
      initCtx();
      if (!ctx) return;
      try {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(420, ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.25 * MetroMonsters.Constants.AUDIO.MASTER_VOLUME, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.18);
      } catch (e) {}
    },
    playSmash: () => {
      playNoise(0.25, 0.4);
      playTone(75, 'sawtooth', 0.2, 0.35);
    },
    playEat: () => {
      playTone(320, 'sine', 0.08, 0.3);
      setTimeout(() => playTone(520, 'sine', 0.1, 0.3), 60);
    },
    playShock: () => {
      playTone(680, 'sawtooth', 0.25, 0.4);
      playNoise(0.25, 0.35);
    },
    playFireball: () => {
      playTone(560, 'sine', 0.15, 0.3);
      playNoise(0.14, 0.25);
    },
    playShoot: () => {
      playTone(380, 'sawtooth', 0.06, 0.25);
    },
    playExplosion: () => {
      playNoise(0.5, 0.6);
      playTone(40, 'sawtooth', 0.45, 0.5);
    },
    playBuildingRumble: () => {
      playNoise(1.2, 0.65);
      playTone(38, 'sawtooth', 1.2, 0.55);
    },
    playRoar: () => {
      playTone(90, 'sawtooth', 0.5, 0.45);
      playNoise(0.4, 0.35);
    }
  });
})();

/* ===== INPUT MANAGER ===== */
MetroMonsters.Input = (() => {
  const keys = {};
  const justPressedKeys = {};
  let pointerClicked = false;
  let clickPos = null;

  window.addEventListener("keydown", (e) => {
    if (!keys[e.code]) {
      justPressedKeys[e.code] = true;
    }
    keys[e.code] = true;
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Enter"].includes(e.code)) {
      e.preventDefault();
    }
  });

  window.addEventListener("keyup", (e) => {
    keys[e.code] = false;
    justPressedKeys[e.code] = false;
  });

  window.addEventListener("pointerdown", (e) => {
    if (e.target.tagName !== "BUTTON") {
      pointerClicked = true;
      const canvas = document.getElementById("game-canvas");
      if (canvas) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = 1280 / rect.width;
        const scaleY = 720 / rect.height;
        clickPos = {
          x: (e.clientX - rect.left) * scaleX,
          y: (e.clientY - rect.top) * scaleY
        };
      }
    }
  });

  return Object.freeze({
    clearPressed: () => {
      for (let k in justPressedKeys) {
        justPressedKeys[k] = false;
      }
      pointerClicked = false;
      clickPos = null;
    },
    getClickPos: () => clickPos,
    isConfirmPressed: (playerNum = 1) => {
      if (pointerClicked) return true;
      if (justPressedKeys["Enter"] || justPressedKeys["Space"] || justPressedKeys["KeyF"] || justPressedKeys["KeyN"] || justPressedKeys["KeyM"] || justPressedKeys["KeyG"]) return true;
      
      const mapping = playerNum === 1 ? MetroMonsters.Constants.CONTROLS.P1_KEYBOARD : MetroMonsters.Constants.CONTROLS.P2_KEYBOARD;
      if (justPressedKeys[mapping.PUNCH] || justPressedKeys[mapping.JUMP]) return true;

      const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
      const gp = gamepads[playerNum - 1];
      if (gp && gp.connected) {
        if (gp.buttons[0]?.pressed || gp.buttons[1]?.pressed || gp.buttons[9]?.pressed) return true;
      }
      return false;
    },
    getPlayerInput: (playerNum) => {
      const isDown = { up: false, down: false, left: false, right: false, punch: false, jump: false };
      const wasPressed = { up: false, down: false, left: false, right: false, punch: false, jump: false };
      
      const mapping = playerNum === 1 ? MetroMonsters.Constants.CONTROLS.P1_KEYBOARD : MetroMonsters.Constants.CONTROLS.P2_KEYBOARD;

      const isUp = keys[mapping.UP] || (playerNum === 1 && keys["ArrowUp"]);
      const isDownKey = keys[mapping.DOWN] || (playerNum === 1 && keys["ArrowDown"]);
      const isLeft = keys[mapping.LEFT] || (playerNum === 1 && keys["ArrowLeft"]);
      const isRight = keys[mapping.RIGHT] || (playerNum === 1 && keys["ArrowRight"]);
      const isPunch = keys[mapping.PUNCH] || (playerNum === 1 && keys["KeyF"]);
      const isJump = keys[mapping.JUMP] || keys["Space"] || (playerNum === 1 && keys["KeyG"]);

      const pUp = justPressedKeys[mapping.UP] || (playerNum === 1 && justPressedKeys["ArrowUp"]);
      const pDown = justPressedKeys[mapping.DOWN] || (playerNum === 1 && justPressedKeys["ArrowDown"]);
      const pLeft = justPressedKeys[mapping.LEFT] || (playerNum === 1 && justPressedKeys["ArrowLeft"]);
      const pRight = justPressedKeys[mapping.RIGHT] || (playerNum === 1 && justPressedKeys["ArrowRight"]);
      const pPunch = justPressedKeys[mapping.PUNCH] || (playerNum === 1 && justPressedKeys["KeyF"]);
      const pJump = justPressedKeys[mapping.JUMP] || justPressedKeys["Space"] || (playerNum === 1 && justPressedKeys["KeyG"]);

      if (isUp) isDown.up = true;
      if (isDownKey) isDown.down = true;
      if (isLeft) isDown.left = true;
      if (isRight) isDown.right = true;
      if (isPunch) isDown.punch = true;
      if (isJump) isDown.jump = true;

      if (pUp) wasPressed.up = true;
      if (pDown) wasPressed.down = true;
      if (pLeft) wasPressed.left = true;
      if (pRight) wasPressed.right = true;
      if (pPunch) wasPressed.punch = true;
      if (pJump) wasPressed.jump = true;

      const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
      const gp = gamepads[playerNum - 1];
      if (gp && gp.connected) {
        if (gp.axes[1] < -0.4 || gp.buttons[12]?.pressed) { isDown.up = true; wasPressed.up = true; }
        if (gp.axes[1] > 0.4 || gp.buttons[13]?.pressed) { isDown.down = true; wasPressed.down = true; }
        if (gp.axes[0] < -0.4 || gp.buttons[14]?.pressed) { isDown.left = true; wasPressed.left = true; }
        if (gp.axes[0] > 0.4 || gp.buttons[15]?.pressed) { isDown.right = true; wasPressed.right = true; }
        if (gp.buttons[0]?.pressed) { isDown.punch = true; wasPressed.punch = true; }
        if (gp.buttons[1]?.pressed) { isDown.jump = true; wasPressed.jump = true; }
      }

      return { isDown, wasPressed };
    },
    wasPausePressed: () => !!(justPressedKeys["KeyP"] || justPressedKeys["Escape"] || justPressedKeys["Pause"])
  });
})();

/* ===== SVG VECTOR GRAPHICS LOADER & SPRITE RENDERER ===== */
MetroMonsters.Sprites = (() => {
  const images = {};

  function loadSVG(key, path) {
    const img = new Image();
    img.src = path;
    images[key] = img;
  }

  loadSVG("manny", "images/manny_gorilla.svg");
  loadSVG("liz", "images/liz_lizard.svg");
  loadSVG("lyall", "images/lyall_werewolf.svg");
  loadSVG("building", "images/building_tiles.svg");
  loadSVG("tank", "images/military_tank.svg");
  loadSVG("helicopter", "images/military_helicopter.svg");
  loadSVG("items", "images/items_food.svg");
  loadSVG("police", "images/police_car.svg");
  loadSVG("ground_cop", "images/ground_cop.svg");
  loadSVG("window_soldier", "images/window_soldier.svg");
  loadSVG("civilian", "images/civilian_human.svg");
  loadSVG("civilian_lady", "images/civilian_lady.svg");
  loadSVG("civilian_worker", "images/civilian_worker.svg");

  function getImageByPath(path) {
    if (!path) return images["civilian"];
    if (!images[path]) {
      loadSVG(path, path);
    }
    return images[path];
  }

  return Object.freeze({
    getImage: (key) => images[key] || getImageByPath(key),
    getImageByPath: getImageByPath,
    drawMonster: (ctx, type, x, y, size, facingLeft, isClimbing, isPunching, isFrontFacing) => {
      ctx.save();
      ctx.translate(x, y);
      if (facingLeft) ctx.scale(-1, 1);

      const img = images[type];
      if (img && img.complete && img.naturalWidth !== 0) {
        // Render High-Detail Vector SVG Sprite anchored cleanly at feet (y = 0)
        ctx.drawImage(img, -size * 0.5, -size * 0.98, size, size);
      }

      if (isPunching) {
        ctx.fillStyle = "#ff1744";
        ctx.beginPath();
        ctx.arc(size * 0.45, -size * 0.4, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffff00";
        ctx.beginPath();
        ctx.arc(size * 0.45, -size * 0.4, 8, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }
  });
})();

/* ===== PARTICLE & VFX ENGINE ===== */
MetroMonsters.VFX = (() => {
  let particles = [];

  return Object.freeze({
    spawnDust: (x, y, count = 8) => {
      for (let i = 0; i < count; i++) {
        particles.push({
          type: "dust",
          x: x + MetroMonsters.Utils.randomRange(-20, 20),
          y: y + MetroMonsters.Utils.randomRange(-10, 10),
          vx: MetroMonsters.Utils.randomRange(-2.5, 2.5),
          vy: MetroMonsters.Utils.randomRange(-3, -0.5),
          radius: MetroMonsters.Utils.randomRange(6, 18),
          alpha: 0.9,
          decay: MetroMonsters.Utils.randomRange(0.015, 0.03),
          color: "#d7ccc8"
        });
      }
    },
    spawnDebris: (x, y, count = 6) => {
      for (let i = 0; i < count; i++) {
        particles.push({
          type: "debris",
          x: x,
          y: y,
          vx: MetroMonsters.Utils.randomRange(-4, 4),
          vy: MetroMonsters.Utils.randomRange(-8, -2),
          size: MetroMonsters.Utils.randomRange(4, 10),
          rotation: 0,
          vRot: MetroMonsters.Utils.randomRange(-0.2, 0.2),
          color: MetroMonsters.Utils.randomChoice(["#b71c1c", "#795548", "#9e9e9e", "#d32f2f"])
        });
      }
    },
    spawnExplosion: (x, y) => {
      MetroMonsters.Audio.playExplosion();
      for (let i = 0; i < 16; i++) {
        particles.push({
          type: "spark",
          x: x,
          y: y,
          vx: MetroMonsters.Utils.randomRange(-6, 6),
          vy: MetroMonsters.Utils.randomRange(-6, 6),
          radius: MetroMonsters.Utils.randomRange(3, 8),
          color: MetroMonsters.Utils.randomChoice(["#ff6d00", "#ffab00", "#ffff00", "#ff1744"]),
          alpha: 1.0,
          decay: 0.04
        });
      }
    },
    spawnTextPopup: (x, y, text, color = "#ffcc00") => {
      particles.push({
        type: "text",
        x: x,
        y: y,
        vy: -1.5,
        text: text,
        color: color,
        alpha: 1.0,
        decay: 0.02
      });
    },
    update: () => {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (p.type === "dust") {
          p.x += p.vx;
          p.y += p.vy;
          p.radius += 0.3;
          p.alpha -= p.decay;
        } else if (p.type === "debris") {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += MetroMonsters.Constants.PHYSICS.GRAVITY * 0.8;
          p.rotation += p.vRot;
          if (p.y > MetroMonsters.Constants.VIEWPORT.ROAD_Y) p.alpha = 0;
        } else if (p.type === "spark" || p.type === "text") {
          p.x += (p.vx || 0);
          p.y += p.vy;
          p.alpha -= p.decay;
        }
        if (p.alpha <= 0) particles.splice(i, 1);
      }
    },
    render: (ctx) => {
      ctx.save();
      particles.forEach((p) => {
        ctx.globalAlpha = Math.max(0, p.alpha || 1.0);
        if (p.type === "dust") {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.type === "debris") {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        } else if (p.type === "spark") {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.type === "text") {
          ctx.fillStyle = p.color;
          ctx.font = "bold 18px 'Courier New', monospace";
          ctx.textAlign = "center";
          ctx.fillText(p.text, p.x, p.y);
        }
      });
      ctx.restore();
    }
  });
})();

/* ===== DESTRUCTIBLE BUILDING ENGINE & INTERACTIVE WINDOW OBJECTS ===== */
MetroMonsters.BuildingManager = (() => {
  let buildings = [];

  class Building {
    constructor(id, x, width, floors, columns, color, isBackRow = false, frontBlockerId = null, stageIndex = 0) {
      this.stageIndex = stageIndex;
      this.id = id;
      this.x = x;
      this.width = width;
      this.floors = floors;
      this.columns = columns;
      this.color = color;
      this.isBackRow = isBackRow;
      this.frontBlockerId = frontBlockerId;
      this.tileW = width / columns;
      this.tileH = MetroMonsters.Constants.BUILDINGS.FLOOR_HEIGHT;
      this.height = floors * this.tileH;
      this.y = MetroMonsters.Constants.VIEWPORT.ROAD_Y - this.height;

      this.isCollapsing = false;
      this.isDestroyed = false;

      this.grid = [];
      const itemChoices = ["FOOD", "SHOWER", "FIRE_PEPPER", "ELECTRIC_WIRE", "DYNAMITE"];
      for (let r = 0; r < floors; r++) {
        const row = [];
        for (let c = 0; c < columns; c++) {
          const roll = Math.random();
          let hasCiv = false;
          let item = null;
          if (roll < 0.40) {
            hasCiv = true;
          } else if (roll < 0.75) {
            item = MetroMonsters.Utils.randomChoice(itemChoices);
          }

          row.push({
            state: 0,
            hasCivilian: hasCiv,
            civSpritePath: MetroMonsters.Demographics.getCityPedestrianSprite(this.stageIndex),
            itemType: item,
            soldierPhase: "INACTIVE",
            soldierTimer: 0,
            soldierType: null,
            soldierCooldown: Math.floor(MetroMonsters.Utils.randomRange(1500, 2700)), // 25-45s initial delay
            slideProgress: 0.0
          });
        }
        this.grid.push(row);
      }
      this.totalTiles = floors * columns;
      this.intactTiles = this.totalTiles;
    }

    // check if front building is standing (because the ones in the back need to wait their turn)
    isInactive() {
      if (this.isBackRow && this.frontBlockerId) {
        const frontBuilding = buildings.find(b => b.id === this.frontBlockerId);
        if (frontBuilding && !frontBuilding.isDestroyed) {
          return true; // Blocked by front building!
        }
      }
      return false;
    }

    isEdgeOccluded(side) {
      if (this.isInactive()) return true;
      const edgeX = (side === "left") ? this.x : (this.x + this.width);
      for (const frontB of buildings) {
        if (frontB.id !== this.id && !frontB.isBackRow && !frontB.isDestroyed && !frontB.isCollapsing) {
          if (edgeX >= frontB.x && edgeX <= frontB.x + frontB.width) {
            return true; // Edge is hidden behind a standing front building!
          }
        }
      }
      return false;
    }

    damageTile(col, floor) {
      if (this.isCollapsing || this.isDestroyed || this.isInactive()) return;
      if (floor < 0 || floor >= this.floors || col < 0 || col >= this.columns) return;

      const tile = this.grid[floor][col];
      if (tile && tile.state < 2) {
        tile.state++;
        tile.soldierPhase = "INACTIVE"; // Destroying window clears soldier
        tile.slideProgress = 0.0;
        MetroMonsters.Audio.playSmash();

        const hitX = this.x + col * this.tileW + this.tileW / 2;
        const hitY = this.y + floor * this.tileH + this.tileH / 2;
        MetroMonsters.VFX.spawnDebris(hitX, hitY, 6);

        if (tile.state === 2) {
          this.intactTiles--;
          if (this.intactTiles / this.totalTiles < MetroMonsters.Constants.BUILDINGS.COLLAPSE_THRESHOLD) {
            this.triggerCollapse();
          }
        }
      }
    }

    triggerCollapse() {
      if (this.isCollapsing || this.isDestroyed) return;
      this.isCollapsing = true;
      MetroMonsters.Audio.playBuildingRumble();
      MetroMonsters.VFX.spawnDust(this.x + this.width / 2, MetroMonsters.Constants.VIEWPORT.ROAD_Y - 20, 24);
    }

    update() {
      if (this.isCollapsing) {
        this.y += 3.0;
        MetroMonsters.VFX.spawnDust(this.x + MetroMonsters.Utils.randomRange(0, this.width), MetroMonsters.Constants.VIEWPORT.ROAD_Y - 10, 2);

        if (this.y >= MetroMonsters.Constants.VIEWPORT.ROAD_Y - 24) {
          this.isCollapsing = false;
          this.isDestroyed = true;
          this.y = MetroMonsters.Constants.VIEWPORT.ROAD_Y - 24;
          this.height = 24;
        }
      } else if (!this.isDestroyed) {
        // Slow Window Soldier State Machine (Slow Slide-In, Aiming Pause, Attack, Waiting, Slow Slide-Out)
        for (let r = 0; r < this.floors; r++) {
          for (let c = 0; c < this.columns; c++) {
            const tile = this.grid[r][c];
            if (tile && tile.state === 0) {
              if (tile.soldierPhase === "SLIDING_IN") {
                tile.slideProgress = Math.min(1.0, tile.slideProgress + 0.015); // ~1.1s slow slide-in
                if (tile.slideProgress >= 1.0) {
                  tile.soldierPhase = "AIMING";
                  tile.soldierTimer = 150; // 2.5s aiming pause for player reaction time!
                }
              } else if (tile.soldierPhase === "AIMING") {
                tile.soldierTimer--;
                if (tile.soldierTimer <= 0) {
                  tile.soldierPhase = "ATTACKING";
                  tile.soldierTimer = 40;
                }
              } else if (tile.soldierPhase === "ATTACKING") {
                tile.soldierTimer--;
                if (tile.soldierTimer === 20) {
                  const wx = this.x + c * this.tileW + (this.tileW - MetroMonsters.Constants.BUILDINGS.WINDOW_WIDTH) / 2;
                  const wy = this.y + r * this.tileH + (this.tileH - MetroMonsters.Constants.BUILDINGS.WINDOW_HEIGHT) / 2;
                  if (tile.soldierType === "DYNAMITE") {
                    MetroMonsters.AIDirector.spawnDynamite(wx + 20, wy + 16, Math.random() > 0.5 ? 2.5 : -2.5, -4.5);
                  } else {
                    MetroMonsters.AIDirector.spawnSniperBullet(wx + 20, wy + 16);
                  }
                }
                if (tile.soldierTimer <= 0) {
                  tile.soldierPhase = "WAITING";
                  tile.soldierTimer = 90; // 1.5s post-attack window wait so player can eat them!
                }
              } else if (tile.soldierPhase === "WAITING") {
                tile.soldierTimer--;
                if (tile.soldierTimer <= 0) {
                  tile.soldierPhase = "SLIDING_OUT";
                }
              } else if (tile.soldierPhase === "SLIDING_OUT") {
                tile.slideProgress = Math.max(0.0, tile.slideProgress - 0.015); // ~1.1s slow slide-out
                if (tile.slideProgress <= 0.0) {
                  tile.soldierPhase = "INACTIVE";
                  tile.soldierCooldown = Math.floor(MetroMonsters.Utils.randomRange(1800, 3000));
                }
              } else if (tile.soldierPhase === "INACTIVE") {
                tile.soldierCooldown--;
                if (tile.soldierCooldown <= 0) {
                  tile.soldierCooldown = Math.floor(MetroMonsters.Utils.randomRange(1800, 3000)); // 30-50s spacing
                  if (Math.random() < 0.15) { // Low occasional spawn chance
                    tile.soldierPhase = "SLIDING_IN";
                    tile.slideProgress = 0.0;
                    tile.soldierType = Math.random() < 0.6 ? "SHOOT" : "DYNAMITE";
                  }
                }
              }
            }
          }
        }
      }
    }

    render(ctx) {
      if (this.isDestroyed) {
        ctx.fillStyle = "#3e2723";
        ctx.fillRect(this.x, MetroMonsters.Constants.VIEWPORT.ROAD_Y - 20, this.width, 20);
        return;
      }

      ctx.save();
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x, this.y, this.width, this.height);
      ctx.strokeStyle = "#1a1a1a";
      ctx.lineWidth = 3;
      ctx.strokeRect(this.x, this.y, this.width, this.height);

      ctx.fillStyle = "#1e293b";
      ctx.fillRect(this.x - 4, this.y - 10, this.width + 8, 14);

      for (let r = 0; r < this.floors; r++) {
        for (let c = 0; c < this.columns; c++) {
          const wx = this.x + c * this.tileW + (this.tileW - MetroMonsters.Constants.BUILDINGS.WINDOW_WIDTH) / 2;
          const wy = this.y + r * this.tileH + (this.tileH - MetroMonsters.Constants.BUILDINGS.WINDOW_HEIGHT) / 2;
          const tile = this.grid[r][c];

          if (tile.state === 0) {
            ctx.fillStyle = "#334155";
            ctx.fillRect(wx, wy, MetroMonsters.Constants.BUILDINGS.WINDOW_WIDTH, MetroMonsters.Constants.BUILDINGS.WINDOW_HEIGHT);
            ctx.fillStyle = "#38bdf8";
            ctx.fillRect(wx + 4, wy + 4, MetroMonsters.Constants.BUILDINGS.WINDOW_WIDTH - 8, MetroMonsters.Constants.BUILDINGS.WINDOW_HEIGHT - 8);

            if (tile.slideProgress > 0.0) {
              // High-Detail Vector Window Soldier sliding into open window with strict inner clipping!
              ctx.save();
              // Clip strictly inside inner window box so soldier NEVER leaks onto building wall!
              ctx.beginPath();
              ctx.rect(wx + 4, wy + 4, MetroMonsters.Constants.BUILDINGS.WINDOW_WIDTH - 8, MetroMonsters.Constants.BUILDINGS.WINDOW_HEIGHT - 8);
              ctx.clip();

              // Window Shade rolling open
              ctx.fillStyle = "#0f172a";
              ctx.fillRect(wx + 4, wy + 4, MetroMonsters.Constants.BUILDINGS.WINDOW_WIDTH - 8, Math.floor(14 * tile.slideProgress));

              // High-Detail Vector SVG Military Soldier
              const soldierImg = MetroMonsters.Sprites.getImage("window_soldier");
              if (soldierImg && soldierImg.complete && soldierImg.naturalWidth !== 0) {
                const drawY = wy + 38 - Math.floor(32 * tile.slideProgress);
                ctx.drawImage(soldierImg, wx + 4, drawY, 32, 32);

                if (tile.soldierType === "DYNAMITE" && tile.slideProgress > 0.6) {
                  // Lit Dynamite spark fuse
                  ctx.fillStyle = "#dc2626"; ctx.fillRect(wx + 26, drawY + 12, 8, 4);
                  ctx.fillStyle = "#f59e0b"; ctx.fillRect(wx + 34, drawY + 10, 3, 3);
                }
              }
              ctx.restore();
            }
          } else if (tile.state === 1) {
            // Authentic Spiderweb Cracked Window with Impact Hole & Strict Inner Glass Clipping!
            ctx.save();
            const ww = MetroMonsters.Constants.BUILDINGS.WINDOW_WIDTH;
            const wh = MetroMonsters.Constants.BUILDINGS.WINDOW_HEIGHT;

            // Outer Frame
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(wx, wy, ww, wh);
            ctx.strokeStyle = "#475569"; ctx.lineWidth = 2;
            ctx.strokeRect(wx, wy, ww, wh);

            // STRICT INNER GLASS CLIPPING: Guarantees cracks NEVER spill onto building wall facade!
            ctx.beginPath();
            ctx.rect(wx + 3, wy + 3, ww - 6, wh - 6);
            ctx.clip();

            // Blue Glass Interior Base
            ctx.fillStyle = "#0284c7";
            ctx.fillRect(wx + 3, wy + 3, ww - 6, wh - 6);

            // Determine variation (0, 1, or 2) deterministically per tile position!
            const varIdx = (r * 7 + c * 3 + (this.id ? this.id.charCodeAt(0) : 0)) % 3;

            let hx = wx + ww / 2;
            let hy = wy + wh / 2;
            if (varIdx === 1) { hx = wx + 15; hy = wy + 26; }
            else if (varIdx === 2) { hx = wx + 25; hy = wy + 20; }

            // Dark Center Impact Hole
            ctx.fillStyle = "#090d16";
            ctx.beginPath();
            ctx.arc(hx, hy, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 1.5; ctx.stroke();

            // Radial Spiderweb Crack Lines (White / Sky Blue)
            ctx.strokeStyle = "rgba(255, 255, 255, 0.95)";
            ctx.lineWidth = 1.2;
            ctx.beginPath();

            // Spoke 1: Top-Left
            ctx.moveTo(hx, hy); ctx.lineTo(wx + 4, wy + 4);
            // Spoke 2: Top
            ctx.moveTo(hx, hy); ctx.lineTo(wx + ww / 2, wy + 3);
            // Spoke 3: Top-Right
            ctx.moveTo(hx, hy); ctx.lineTo(wx + ww - 4, wy + 4);
            // Spoke 4: Right
            ctx.moveTo(hx, hy); ctx.lineTo(wx + ww - 3, wy + wh / 2);
            // Spoke 5: Bottom-Right
            ctx.moveTo(hx, hy); ctx.lineTo(wx + ww - 4, wy + wh - 4);
            // Spoke 6: Bottom
            ctx.moveTo(hx, hy); ctx.lineTo(wx + ww / 2, wy + wh - 3);
            // Spoke 7: Bottom-Left
            ctx.moveTo(hx, hy); ctx.lineTo(wx + 4, wy + wh - 4);
            // Spoke 8: Left
            ctx.moveTo(hx, hy); ctx.lineTo(wx + 3, wy + wh / 2);
            ctx.stroke();

            // Concentric Spiderweb Rings connecting the spokes!
            ctx.strokeStyle = "rgba(224, 242, 254, 0.85)";
            ctx.lineWidth = 1.0;
            ctx.beginPath();

            // Inner Spiderweb Ring
            ctx.arc(hx, hy, 10, 0, Math.PI * 2);
            // Outer Spiderweb Ring
            ctx.moveTo(hx + 16, hy);
            ctx.arc(hx, hy, 16, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
          } else if (tile.state === 2) {
            // High-Contrast Fully Smashed Window Hole (Pitch Black Interior with Distinct Brick Frame)
            ctx.fillStyle = "#050811";
            ctx.fillRect(wx - 2, wy - 2, MetroMonsters.Constants.BUILDINGS.WINDOW_WIDTH + 4, MetroMonsters.Constants.BUILDINGS.WINDOW_HEIGHT + 4);
            ctx.strokeStyle = "#78350f"; ctx.lineWidth = 2;
            ctx.strokeRect(wx - 2, wy - 2, MetroMonsters.Constants.BUILDINGS.WINDOW_WIDTH + 4, MetroMonsters.Constants.BUILDINGS.WINDOW_HEIGHT + 4);
            
            if (tile.hasCivilian) {
              const civImg = MetroMonsters.Sprites.getImageByPath(tile.civSpritePath);
              if (civImg && civImg.complete && civImg.naturalWidth !== 0) {
                ctx.save();
                ctx.drawImage(civImg, wx + 8, wy + 8, 24, 32);
                ctx.restore();
              }
            } else if (tile.itemType) {
              // High-Detail Vector Art for Window Items
              ctx.save();
              if (tile.itemType === "FOOD") {
                // Layered Double Cheeseburger
                ctx.fillStyle = "#d97706";
                ctx.beginPath(); ctx.arc(wx + 20, wy + 16, 12, Math.PI, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#16a34a"; ctx.fillRect(wx + 8, wy + 17, 24, 3);
                ctx.fillStyle = "#b91c1c"; ctx.fillRect(wx + 10, wy + 20, 20, 3);
                ctx.fillStyle = "#451a03"; ctx.fillRect(wx + 8, wy + 23, 24, 5);
                ctx.fillStyle = "#f59e0b"; ctx.fillRect(wx + 10, wy + 28, 20, 4);
              } else if (tile.itemType === "SHOWER") {
                // Porcelain Clawfoot Tub & Chrome Showerhead
                ctx.fillStyle = "#ffffff";
                ctx.beginPath(); ctx.arc(wx + 20, wy + 28, 14, 0, Math.PI); ctx.fill();
                ctx.fillRect(wx + 6, wy + 22, 28, 6);
                ctx.fillStyle = "#94a3b8";
                ctx.fillRect(wx + 10, wy + 35, 4, 5); ctx.fillRect(wx + 26, wy + 35, 4, 5);
                ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(wx + 10, wy + 22); ctx.lineTo(wx + 10, wy + 8); ctx.lineTo(wx + 22, wy + 8); ctx.stroke();
                ctx.fillStyle = "#94a3b8"; ctx.fillRect(wx + 18, wy + 8, 8, 4);
                ctx.fillStyle = "#38bdf8";
                ctx.fillRect(wx + 20, wy + 14, 2, 4); ctx.fillRect(wx + 24, wy + 16, 2, 4);
              } else if (tile.itemType === "FIRE_PEPPER") {
                // Fiery Jalapeno & Flame Aura
                ctx.fillStyle = "rgba(255, 109, 0, 0.4)";
                ctx.beginPath(); ctx.arc(wx + 20, wy + 24, 14, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#dc2626";
                ctx.beginPath(); ctx.ellipse(wx + 20, wy + 24, 7, 14, 0.2, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#16a34a";
                ctx.beginPath(); ctx.arc(wx + 18, wy + 10, 3, 0, Math.PI * 2); ctx.fill();
              } else if (tile.itemType === "ELECTRIC_WIRE") {
                // Wall Outlet Junction Box & Severed Sparking Cables
                ctx.fillStyle = "#1e293b"; ctx.fillRect(wx + 10, wy + 12, 20, 24);
                ctx.fillStyle = "#475569"; ctx.fillRect(wx + 12, wy + 14, 16, 20);
                ctx.strokeStyle = "#b45309"; ctx.lineWidth = 3.5;
                ctx.beginPath(); ctx.moveTo(wx + 16, wy + 24); ctx.lineTo(wx + 6, wy + 14); ctx.stroke();
                ctx.strokeStyle = "#dc2626";
                ctx.beginPath(); ctx.moveTo(wx + 24, wy + 24); ctx.lineTo(wx + 34, wy + 12); ctx.stroke();
                ctx.strokeStyle = (Math.floor(Date.now() / 100) % 2 === 0) ? "#ffff00" : "#38bdf8";
                ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.moveTo(wx + 4, wy + 10); ctx.lineTo(wx + 10, wy + 16); ctx.lineTo(wx + 6, wy + 22); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(wx + 36, wy + 8); ctx.lineTo(wx + 30, wy + 14); ctx.lineTo(wx + 34, wy + 20); ctx.stroke();
              } else if (tile.itemType === "DYNAMITE") {
                // 3-Stick Dynamite Bundle labeled TNT with Burning Fuse
                ctx.fillStyle = "#b91c1c";
                ctx.fillRect(wx + 8, wy + 16, 7, 22);
                ctx.fillRect(wx + 17, wy + 14, 7, 24);
                ctx.fillRect(wx + 26, wy + 16, 7, 22);
                ctx.fillStyle = "#0f172a";
                ctx.fillRect(wx + 6, wy + 22, 28, 4);
                ctx.fillRect(wx + 6, wy + 30, 28, 4);
                ctx.fillStyle = "#facc15"; ctx.font = "900 8px monospace"; ctx.textAlign = "center";
                ctx.fillText("TNT", wx + 20, wy + 26);
                ctx.strokeStyle = "#78350f"; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(wx + 20, wy + 14); ctx.lineTo(wx + 20, wy + 6); ctx.stroke();
                ctx.fillStyle = (Math.floor(Date.now() / 80) % 2 === 0) ? "#ff6d00" : "#ffff00";
                ctx.beginPath(); ctx.arc(wx + 20, wy + 6, 3.5, 0, Math.PI * 2); ctx.fill();
              }
              ctx.restore();
            }
          }
        }
      }
      ctx.restore();
    }
  }

  return Object.freeze({
    loadStage: (stageIndex) => {
      const stage = MetroMonsters.Constants.STAGES[stageIndex % MetroMonsters.Constants.STAGES.length];
      buildings = stage.buildings.map(b => new Building(b.id, b.x, b.width, b.floors, b.cols, b.color, b.isBackRow, b.frontBlockerId, stageIndex));
    },
    getBuildings: () => buildings,
    areAllBuildingsDestroyed: () => buildings.length > 0 && buildings.every(b => b.isDestroyed),
    update: () => { buildings.forEach(b => b.update()); },
    render: (ctx) => {
      ctx.save();
      // Clip rendering to sky zone above street level so collapsing buildings sink into ground behind the road
      ctx.beginPath();
      ctx.rect(0, 0, MetroMonsters.Constants.VIEWPORT.WIDTH, MetroMonsters.Constants.VIEWPORT.ROAD_Y - 10);
      ctx.clip();
      // Render back-row buildings first, then front-row buildings on top!
      buildings.filter(b => b.isBackRow).forEach(b => b.render(ctx));
      buildings.filter(b => !b.isBackRow).forEach(b => b.render(ctx));
      ctx.restore();
    }
  });
})();

/* ===== ENTITY ENGINE (Monsters & Fire-Breathing Ability) ===== */
MetroMonsters.Entities = (() => {
  class Monster {
    constructor(playerNum, config, isCPU = false) {
      this.playerNum = playerNum;
      this.config = config;
      this.id = config.id;
      this.name = config.name;
      this.color = config.color;
      this.isCPU = isCPU;

      this.x = playerNum === 1 ? 280 : 720;
      this.y = MetroMonsters.Constants.VIEWPORT.ROAD_Y;
      this.vx = 0;
      this.vy = 0;
      this.size = 72;

      this.hp = 100;
      this.score = 0;
      this.isAlive = true;
      this.isClimbing = false;
      this.attachedBuilding = null;
      this.climbSide = null;
      this.facingLeft = playerNum === 2;
      this.isFrontFacing = false;

      this.isPunching = false;
      this.punchTimer = 0;
      this.fireBreathTimer = 0;
      this.electroShockTimer = 0;
    }

    update() {
      if (!this.isAlive) return;

      if (this.fireBreathTimer > 0) this.fireBreathTimer--;
      if (this.electroShockTimer > 0) this.electroShockTimer--;

      let isDown = { up: false, down: false, left: false, right: false, punch: false, jump: false };
      let wasPressed = { up: false, down: false, left: false, right: false, punch: false, jump: false };

      if (this.isCPU) {
        if (Math.random() < 0.04) wasPressed.punch = true;
        if (Math.random() < 0.02) wasPressed.jump = true;
        if (this.isClimbing) {
          isDown.up = Math.random() > 0.3;
          isDown.down = Math.random() > 0.8;
        } else {
          isDown.left = this.x > 600;
          isDown.right = this.x <= 600;
        }
      } else {
        const input = MetroMonsters.Input.getPlayerInput(this.playerNum);
        isDown = input.isDown;
        wasPressed = input.wasPressed;
      }

      if (wasPressed.punch && !this.isPunching) {
        this.isPunching = true;
        this.punchTimer = 12;
        MetroMonsters.Audio.playPunch();

        // Fire Breathing Powerup!
        if (this.fireBreathTimer > 0) {
          MetroMonsters.Audio.playFireball();
          MetroMonsters.AIDirector.spawnFireball(
            this.x + (this.facingLeft ? -40 : 40),
            this.y - 45,
            this.facingLeft ? -8 : 8
          );
        }

        this.performPunch();
      }

      if (this.punchTimer > 0) {
        this.punchTimer--;
        if (this.punchTimer === 0) this.isPunching = false;
      }

      const buildings = MetroMonsters.BuildingManager.getBuildings();

      if (this.isClimbing && this.attachedBuilding) {
        const b = this.attachedBuilding;
        this.vy = 0;

        if (isDown.up) this.y -= MetroMonsters.Constants.PHYSICS.CLIMB_SPEED_Y * this.config.climbSpeedMult;
        if (isDown.down) this.y += MetroMonsters.Constants.PHYSICS.CLIMB_SPEED_Y * this.config.climbSpeedMult;

        if (this.climbSide === "left") {
          this.x = b.x;
          this.facingLeft = false;
        } else {
          this.x = b.x + b.width;
          this.facingLeft = true;
        }

        // Top Roof Boundary Check: Stop climbing at building roof cap ledge (b.y - 10) and transition to standing on roof!
        if (this.y <= b.y - 10) {
          this.y = b.y - 10;
          this.isClimbing = false;
          this.attachedBuilding = null;
        }

        if (this.y >= MetroMonsters.Constants.VIEWPORT.ROAD_Y) {
          this.y = MetroMonsters.Constants.VIEWPORT.ROAD_Y;
          this.isClimbing = false;
          this.attachedBuilding = null;
        }

        if (wasPressed.jump) {
          this.isClimbing = false;
          this.attachedBuilding = null;
          this.vy = MetroMonsters.Constants.PHYSICS.JUMP_FORCE;
          this.vx = (this.climbSide === "left") ? -2.5 : 2.5;
          MetroMonsters.Audio.playJump();
        }

        if (b.isCollapsing) {
          this.isClimbing = false;
          this.attachedBuilding = null;
          this.hp -= MetroMonsters.Constants.PHYSICS.COLLAPSE_DAMAGE;
          MetroMonsters.VFX.spawnTextPopup(this.x, this.y, "-12 HP", "#ff1744");
        }
      } else {
        this.isFrontFacing = isDown.down;

        if (isDown.left) {
          this.vx = -MetroMonsters.Constants.PHYSICS.WALK_SPEED;
          this.facingLeft = true;
        } else if (isDown.right) {
          this.vx = MetroMonsters.Constants.PHYSICS.WALK_SPEED;
          this.facingLeft = false;
        } else {
          this.vx *= MetroMonsters.Constants.PHYSICS.GROUND_FRICTION;
        }

        // Determine surface Y under monster (Street ground ROAD_Y or Building Roof Cap b.y - 10)
        let targetSurfaceY = MetroMonsters.Constants.VIEWPORT.ROAD_Y;
        buildings.forEach(b => {
          if (!b.isDestroyed && !b.isCollapsing) {
            if (this.x >= b.x - 12 && this.x <= b.x + b.width + 12) {
              const roofElevation = b.y - 10;
              if (this.y <= roofElevation + 18 && roofElevation < targetSurfaceY) {
                targetSurfaceY = roofElevation;
              }
            }
          }
        });

        if (wasPressed.jump && this.y >= targetSurfaceY - 4) {
          this.vy = MetroMonsters.Constants.PHYSICS.JUMP_FORCE;
          MetroMonsters.Audio.playJump();
        }

        this.vy += MetroMonsters.Constants.PHYSICS.GRAVITY;
        this.vy = Math.min(this.vy, MetroMonsters.Constants.PHYSICS.MAX_FALL_SPEED);

        this.x += this.vx;
        this.y += this.vy;

        // Clamp Y so monster never flies off top of screen!
        if (this.y < 60) {
          this.y = 60;
          this.vy = Math.max(0, this.vy);
        }

        // Check Landing on Vehicles / Helicopters to CRUSH them!
        const monsterBox = { x: this.x - 28, y: this.y - 56, w: 56, h: 56 };
        MetroMonsters.AIDirector.checkVehicleCrush(monsterBox, this);

        if (this.y >= targetSurfaceY) {
          this.y = targetSurfaceY;
          this.vy = 0;
        }

        if (isDown.up || isDown.down) {
          buildings.forEach((b) => {
            if (!b.isDestroyed && !b.isCollapsing) {
              const nearLeftEdge = Math.abs(this.x - b.x) < 32;
              const nearRightEdge = Math.abs(this.x - (b.x + b.width)) < 32;
              if ((nearLeftEdge || nearRightEdge) && this.y <= MetroMonsters.Constants.VIEWPORT.ROAD_Y && this.y >= b.y) {
                this.isClimbing = true;
                this.attachedBuilding = b;
                this.climbSide = nearLeftEdge ? "left" : "right";
                this.vy = 0;
              }
            }
          });
        }
      }

      this.x = MetroMonsters.Utils.clamp(this.x, 40, MetroMonsters.Constants.VIEWPORT.WIDTH - 40);
    }

    performPunch() {
      const punchX = this.facingLeft ? (this.x - 54) : (this.x + 14);
      const punchY = this.y - 45;
      const punchBox = { x: punchX, y: punchY, w: 40, h: 40 };

      // Damage Building Windows / Handle Interactive Objects
      const buildings = MetroMonsters.BuildingManager.getBuildings();
      buildings.forEach(b => {
        if (!b.isDestroyed && !b.isCollapsing) {
          if (punchX + 40 >= b.x && punchX <= b.x + b.width) {
            const relY = punchY - b.y;
            const floor = Math.floor(relY / b.tileH);
            const relX = (punchX + 20) - b.x;
            const col = Math.floor(relX / b.tileW);

            if (b.grid && floor >= 0 && floor < b.grid.length) {
              const row = b.grid[floor];
              if (row && col >= 0 && col < row.length) {
                const tile = row[col];
                if (tile) {
                  if (tile.state === 0 && tile.slideProgress > 0.1) {
                    // Eating Military Window Soldier!
                    tile.soldierPhase = "INACTIVE";
                    tile.slideProgress = 0.0;
                    tile.soldierTimer = 0;
                    this.hp = Math.min(100, this.hp + 15);

                      this.hp = Math.min(100, this.hp + 15);

      if (!this.isAlive) return;
      if (this.electroShockTimer > 0) {
        // Flashing Electrocuted Skeleton Shock Frame (1986 Arcade Effect)
        ctx.save();
        ctx.translate(this.x, this.y);
        if (this.facingLeft) ctx.scale(-1, 1);

        const isWhite = Math.floor(Date.now() / 60) % 2 === 0;
        ctx.fillStyle = isWhite ? "#ffffff" : "#0f172a";
        ctx.fillRect(-this.size * 0.35, -this.size * 0.85, this.size * 0.7, this.size * 0.85);

        ctx.strokeStyle = isWhite ? "#000000" : "#ffffff";

        ctx.beginPath();
        ctx.arc(0, -this.size * 0.7, 12, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, -this.size * 0.55);
        ctx.lineTo(0, -this.size * 0.2);
        ctx.moveTo(-16, -this.size * 0.45); ctx.lineTo(16, -this.size * 0.45);
        ctx.moveTo(-14, -this.size * 0.35); ctx.lineTo(14, -this.size * 0.35);

        // Flashing Electric Sparks
        ctx.strokeStyle = Math.floor(Date.now() / 40) % 2 === 0 ? "#ffff00" : "#38bdf8";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-this.size * 0.45, -this.size * 0.6);
        ctx.lineTo(-this.size * 0.25, -this.size * 0.4);
        ctx.lineTo(-this.size * 0.5, -this.size * 0.2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(this.size * 0.45, -this.size * 0.6);
        ctx.lineTo(this.size * 0.25, -this.size * 0.4);

/* ===== AI DIRECTOR (Tanks, Police Cars & Attack Helicopters) ===== */
MetroMonsters.AIDirector = (() => {
  let vehicles = [];
  let helicopters = [];
  let groundCivilians = [];

  class Vehicle {
    constructor(type) {
      this.type = type;
      this.width = type === "tank" ? 80 : 64;
      this.height = 40;
      this.alive = false;
      this.respawnTimer = 120;
      this.hasEnteredScreen = false;
      this.resetPosition();
    }

    resetPosition() {
      const spawnLeft = Math.random() > 0.5;
      this.x = spawnLeft ? -120 : MetroMonsters.Constants.VIEWPORT.WIDTH + 120;
      this.y = MetroMonsters.Constants.VIEWPORT.ROAD_Y - this.height;
      this.facingLeft = !spawnLeft;
      this.vx = 0;
      this.maxSpeed = this.type === "tank" ? 1.0 : 1.5;
      this.shootTimer = Math.floor(MetroMonsters.Utils.randomRange(90, 180));
      this.isStopped = false;
      this.hasEnteredScreen = false;
    }

    update(monsters) {
      if (!this.alive) {
        this.respawnTimer--;
        if (this.respawnTimer <= 0) {
          this.alive = true;
          this.resetPosition();
        }
        return;
      }

      // Detect when vehicle has FULLY entered the visible screen area (well past the edge margins)
      if (!this.hasEnteredScreen && this.x >= 120 && this.x <= MetroMonsters.Constants.VIEWPORT.WIDTH - this.width - 120) {
        this.hasEnteredScreen = true;
      }

      // Track closest active player monster
      let target = null;
      let minDist = 99999;
      monsters.forEach(m => {
        if (m && m.isAlive) {
          const dist = Math.abs(m.x - (this.x + this.width / 2));
          if (dist < minDist) {
            minDist = dist;
            target = m;
          }
        }
      });

      if (!this.hasEnteredScreen) {
        // MUST drive fully onto screen first! NO stopping or turning back while entering from edge!
        this.isStopped = false;
        const targetVx = this.facingLeft ? -this.maxSpeed : this.maxSpeed;
        this.vx += (targetVx - this.vx) * 0.12;
      } else if (target) {
        const monsterCenterX = target.x;
        const vehicleCenterX = this.x + this.width / 2;
        const dist = Math.abs(monsterCenterX - vehicleCenterX);

        // Turn around to face player monster when needed
        if (monsterCenterX < vehicleCenterX && !this.facingLeft) {
          this.facingLeft = true;
        } else if (monsterCenterX > vehicleCenterX && this.facingLeft) {
          this.facingLeft = false;
        }

        // Tactical Movement: Drive toward monster until in attack range, then COME TO A COMPLETE STANDSTILL!
        if (dist <= 320) {
          // In attack position: STOP MOVING and stay stationary!
          this.isStopped = true;
          this.vx *= 0.85;
          if (Math.abs(this.vx) < 0.05) this.vx = 0;
        } else {
          // Too far away! Drive smoothly toward player monster to get in range
          this.isStopped = false;
          const targetVx = this.facingLeft ? -this.maxSpeed : this.maxSpeed;
          this.vx += (targetVx - this.vx) * 0.08;
        }
      } else {
        // Drive smoothly if no player monster active
        this.isStopped = false;
        const targetVx = this.facingLeft ? -this.maxSpeed : this.maxSpeed;
        this.vx += (targetVx - this.vx) * 0.08;
      }

      this.x += this.vx;

      // ONCE FULLY ON SCREEN, STRICTLY LOCKED FULLY INSIDE PLAYFIELD (CANNOT DRIFT TO EDGE OR OFF SCREEN)!
      if (this.hasEnteredScreen) {
        const minX = 100;
        const maxX = MetroMonsters.Constants.VIEWPORT.WIDTH - this.width - 100;
        if (this.x < minX) {
          this.x = minX;
          this.vx = 0;
        } else if (this.x > maxX) {
          this.x = maxX;
          this.vx = 0;
        }
      } else {
        if (this.x < -180 || this.x > MetroMonsters.Constants.VIEWPORT.WIDTH + 180) {

          this.respawnTimer = Math.floor(MetroMonsters.Utils.randomRange(1200, 1800));

      this.shootTimer--;

        this.shootTimer = Math.floor(MetroMonsters.Utils.randomRange(140, 240));
        if (this.hasEnteredScreen && target && target.isAlive && Math.abs(target.x - (this.x + this.width / 2)) < 450) {

            x: muzzleX,
            y: muzzleY,
            vx: Math.cos(angle) * 4.0,
            vy: Math.sin(angle) * 4.0,
            damage: this.type === "tank" ? 7 : 2,

    render(ctx) {
      if (!this.alive) return;
      ctx.save();
      const img = MetroMonsters.Sprites.getImage(this.type === "tank" ? "tank" : "police");
      if (img && img.complete) {
        if (this.facingLeft) {
          ctx.translate(this.x + this.width, this.y);
          ctx.scale(-1, 1);
          ctx.drawImage(img, 0, 0, this.width, this.height);
        } else {
          ctx.drawImage(img, this.x, this.y, this.width, this.height);
        }
      }
      ctx.restore();

  class Helicopter {

      this.shootTimer = MetroMonsters.Utils.randomRange(140, 240);
      this.hasEnteredScreen = false;
    }

    update(monsters) {
      if (!this.alive) {
        this.respawnTimer--;
        if (this.respawnTimer <= 0) {
          this.alive = true;
          this.resetPosition();
        }

      }

      // Detect when helicopter FULLY enters visible sky playfield area
      if (!this.hasEnteredScreen && this.x >= 120 && this.x <= MetroMonsters.Constants.VIEWPORT.WIDTH - this.width - 120) {
        this.hasEnteredScreen = true;
      }

      // Track closest active player monster
      let target = null;
      let minDist = 99999;
      monsters.forEach(m => {
        if (m && m.isAlive) {
          const dist = Math.hypot(m.x - this.x, m.y - this.y);
          if (dist < minDist) {
            minDist = dist;
            target = m;
          }
        }
      });

      let targetTilt = 0;

      if (!this.hasEnteredScreen) {
        // MUST fly continuously inward onto screen first! NO stopping or shooting while entering from side!
        this.vx = this.facingLeft ? -1.0 : 1.0;
        this.vy = 0;
        targetTilt = 0;
      } else if (target) {
        // Ideal attack hover position (offset 140px to side and 120px above monster)
        const destX = target.x + (this.facingLeft ? 140 : -140);
        const destY = Math.max(80, target.y - 120);

        const dx = destX - this.x;
        const dy = destY - this.y;

        // Smooth turnaround when player moves behind helicopter
        if (Math.abs(target.x - this.x) > 90) {
          if (target.x < this.x && !this.facingLeft) {
            this.facingLeft = true;
          } else if (target.x > this.x && this.facingLeft) {
            this.facingLeft = false;
          }
        }

        // Damped hover movement with gradual acceleration and smooth deceleration:
        const isBackingUp = (this.facingLeft && dx > 0) || (!this.facingLeft && dx < 0);
        const accelX = isBackingUp ? 0.0006 : 0.0015; // Sluggish acceleration from a still hover when backing up
        const maxSpeedX = isBackingUp ? 0.25 : 0.9;

        if (Math.abs(dx) < 20) {
          this.vx *= 0.85; // Decelerate smoothly to steady hover
          if (Math.abs(this.vx) < 0.03) this.vx = 0;
        } else {
          this.vx += dx * accelX;
          this.vx = MetroMonsters.Utils.clamp(this.vx, -maxSpeedX, maxSpeedX);
        }

        if (Math.abs(dy) < 20) {
          this.vy *= 0.85; // Decelerate smoothly to steady hover Y
          if (Math.abs(this.vy) < 0.03) this.vy = 0;
        } else {
          this.vy += dy * 0.0012;
          this.vy = MetroMonsters.Utils.clamp(this.vy, -0.5, 0.5);
        }

        // Firing rockets & smooth nose tilt towards target
        const gunX = this.x + (this.facingLeft ? 12 : 84);
        const gunY = this.y + 28;
        const angle = Math.atan2((target.y - 30) - gunY, target.x - gunX);

        if (this.facingLeft) {
          let relAngle = angle - Math.PI;
          while (relAngle > Math.PI) relAngle -= Math.PI * 2;
          while (relAngle < -Math.PI) relAngle += Math.PI * 2;
          targetTilt = MetroMonsters.Utils.clamp(relAngle, -0.35, 0.1);
        } else {
          targetTilt = MetroMonsters.Utils.clamp(angle, -0.1, 0.35);
        }

        this.shootTimer--;
        if (this.shootTimer <= 0) {
          this.shootTimer = MetroMonsters.Utils.randomRange(180, 300); // Tactical bursts
          MetroMonsters.Audio.playShoot();
          projectiles.push({
            x: gunX,
            y: gunY,
            vx: Math.cos(angle) * 4.2,
            vy: Math.sin(angle) * 4.2,
            damage: 3,
            color: "#ff1744"
          });
        }
      } else {
        // Rock-solid level flight across screen when no target active
        this.vx = this.facingLeft ? -0.9 : 0.9;
        this.vy = 0;
        targetTilt = 0;
      }

      this.x += this.vx;
      this.y += this.vy;
      this.y = MetroMonsters.Utils.clamp(this.y, 60, 420);

      // ONCE VISIBLE ON SCREEN, CANNOT BACK UP OR DRIFT OFF SCREEN OUT OF VISIBILITY!
      if (this.hasEnteredScreen) {
        const minX = 40;
        const maxX = MetroMonsters.Constants.VIEWPORT.WIDTH - this.width - 40;
        if (this.x < minX) {
          this.x = minX;
          this.vx = Math.max(0, this.vx);

          this.alive = false;
          this.respawnTimer = MetroMonsters.Utils.randomRange(1800, 2700);
        }
      }

      // Smoothly interpolate pitch tilt without rapid jitter
      this.pitchAngle += (targetTilt - this.pitchAngle) * 0.05;
    }

    render(ctx) {
      if (!this.alive) return;
      ctx.save();
      ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
      ctx.rotate(this.pitchAngle);

          if (isLandingJump || isActivelyPunching) {
            if (Math.abs(m.x - (this.x + 12)) < 36 && Math.abs(m.y - (this.y + 16)) < 44) {
              this.isEaten = true;
              this.respawnTimer = MetroMonsters.Utils.randomRange(900, 1800); // 15-30 seconds timer
              m.hp = Math.min(100, m.hp + 15);
              m.score += 500;
              MetroMonsters.Audio.playEat();
              MetroMonsters.VFX.spawnTextPopup(m.x, m.y - 30, "+15 HP / EAT COP!", "#00ff7f");
            }
          }
        }
      });
    }

    render(ctx) {
      if (this.isEaten) return;
      ctx.save();
      const img = MetroMonsters.Sprites.getImage("ground_cop");
      if (img && img.complete && img.naturalWidth !== 0) {
        if (this.facingLeft) {
          ctx.translate(this.x + 28, this.y);
          ctx.scale(-1, 1);
          ctx.drawImage(img, 0, 0, 28, 42);
        } else {
          ctx.drawImage(img, this.x, this.y, 28, 42);
        }
      }
      ctx.restore();
    }
  }

  let groundCops = [];
  let dynamites = [];
  let vehicleOverlapTimer = 0;

  return Object.freeze({
    init: (stageIndex = 0) => {
      const totalStages = MetroMonsters.Constants.STAGES.length;
      const progressRatio = Math.min(1.0, stageIndex / Math.max(1, totalStages - 1));

      // Dynamic Difficulty Progression Curve across all campaign stages!
      const targetVehicleCount = Math.min(5, Math.floor(2 + progressRatio * 3)); // 2 to 5 active vehicles (cop cars + tanks)!
      const targetHeliCount = progressRatio >= 0.4 ? 2 : 1;                      // 1 to 2 active helicopters!
      const targetCopCount = Math.min(8, Math.floor(2 + progressRatio * 6));    // 2 to 8 active police officers!

      vehicles = [];
      for (let i = 0; i < targetVehicleCount; i++) {
        const type = i % 2 === 0 ? "tank" : "police";
        const v = new Vehicle(type);
        v.alive = true;
        v.resetPosition();
        vehicles.push(v);
      }

      helicopters = [];
      for (let i = 0; i < targetHeliCount; i++) {
        const h = new Helicopter();
        h.alive = true;
        h.resetPosition();
        helicopters.push(h);
      }

      groundCivilians = [
        new GroundCivilian(180),
        new GroundCivilian(420),
        new GroundCivilian(680),
        new GroundCivilian(920),
        new GroundCivilian(1120)
      ];

      groundCops = [];
      for (let i = 0; i < targetCopCount; i++) {
        const spawnX = (i % 2 === 0) ? -20 - (i * 30) : MetroMonsters.Constants.VIEWPORT.WIDTH + 20 + (i * 30);
        groundCops.push(new GroundCop(spawnX));
      }

      projectiles = [];
      fireballs = [];
      dynamites = [];
      vehicleOverlapTimer = 0;
    },
    spawnFireball: (x, y, vx) => {
      fireballs.push({ x, y, vx, vy: 0, radius: 10, dead: false });
    },
    spawnDynamite: (x, y, vx, vy) => {
      dynamites.push({ x, y, vx, vy, gravity: 0.15, rotation: 0, alive: true });
    },
    spawnSniperBullet: (x, y) => {
      MetroMonsters.Audio.playShoot();
      projectiles.push({
        x: x, y: y,
        vx: MetroMonsters.Utils.randomChoice([-4.8, 4.8]),
        vy: 1.5,
        damage: 2,
        color: "#ffff00"
      });
    },
    checkVehiclePunch: (punchBox, monster) => {
      vehicles.forEach(v => {
        if (v.alive && MetroMonsters.Utils.rectIntersect(punchBox, { x: v.x, y: v.y, w: v.width, h: v.height })) {
          v.alive = false;
          v.respawnTimer = MetroMonsters.Utils.randomRange(600, 1200); // 10-20s respawn delay
          monster.score += 500;
          MetroMonsters.Audio.playExplosion();
          MetroMonsters.VFX.spawnExplosion(v.x + v.width / 2, v.y + v.height / 2);
          MetroMonsters.VFX.spawnTextPopup(v.x + v.width / 2, v.y - 20, "+500 PTS", "#ffcc00");
        }
      });
      helicopters.forEach(h => {
        if (h.alive && MetroMonsters.Utils.rectIntersect(punchBox, { x: h.x, y: h.y, w: h.width, h: h.height })) {
          h.alive = false;
          h.respawnTimer = Math.floor(MetroMonsters.Utils.randomRange(2400, 3600)); // 40-60s delay after destruction
          monster.score += 1000;
          MetroMonsters.Audio.playExplosion();
          MetroMonsters.VFX.spawnExplosion(h.x + h.width / 2, h.y + h.height / 2);
          MetroMonsters.VFX.spawnTextPopup(h.x + h.width / 2, h.y - 20, "HELI DOWN! +1000", "#ffcc00");
        }
      });
    },
    checkVehicleCrush: (monsterBox, monster) => {
      if (monster.vy <= 0.5) return;
      vehicles.forEach(v => {
        if (v.alive && MetroMonsters.Utils.rectIntersect(monsterBox, { x: v.x, y: v.y, w: v.width, h: v.height })) {
          v.alive = false;
          v.respawnTimer = MetroMonsters.Utils.randomRange(600, 1200); // 10-20s respawn delay
          monster.score += 500;
          monster.vy = -2.8;
          MetroMonsters.Audio.playExplosion();
          MetroMonsters.VFX.spawnExplosion(v.x + v.width / 2, v.y + v.height / 2);
          MetroMonsters.VFX.spawnTextPopup(v.x + v.width / 2, v.y - 20, "CRUSHED! +500", "#ffcc00");
        }
      });
      helicopters.forEach(h => {
        if (h.alive && MetroMonsters.Utils.rectIntersect(monsterBox, { x: h.x, y: h.y, w: h.width, h: h.height })) {
          h.alive = false;
          h.respawnTimer = Math.floor(MetroMonsters.Utils.randomRange(2400, 3600)); // 40-60s delay after destruction
          monster.score += 1000;
          monster.vy = -3.2;
          MetroMonsters.Audio.playExplosion();
          MetroMonsters.VFX.spawnExplosion(h.x + h.width / 2, h.y + h.height / 2);
          MetroMonsters.VFX.spawnTextPopup(h.x + h.width / 2, h.y - 20, "HELI CRUSHED! +1000", "#ffcc00");
        }
      });
    },
    update: (monsters) => {
      vehicles.forEach(v => v.update(monsters));

      // Allow vehicles to pass each other freely! ONLY un-stick if occupying the same spot for > 2 seconds (120 frames):
      if (vehicles.length >= 2) {
        const v1 = vehicles[0];
        const v2 = vehicles[1];
        if (v1 && v2 && v1.alive && v2.alive && v1.hasEnteredScreen && v2.hasEnteredScreen) {
          const center1 = v1.x + v1.width / 2;
          const center2 = v2.x + v2.width / 2;
          const isOccupyingSameSpot = Math.abs(center1 - center2) < 40;

          if (isOccupyingSameSpot) {
            vehicleOverlapTimer++;
            // ONLY if stuck occupying the same spot for MORE than 2 seconds (120 frames):
            if (vehicleOverlapTimer >= 120) {
              const nudge = center1 <= center2 ? -1.5 : 1.5;
              v1.x += nudge;
              v2.x -= nudge;
              v1.x = MetroMonsters.Utils.clamp(v1.x, 30, MetroMonsters.Constants.VIEWPORT.WIDTH - v1.width - 30);
              v2.x = MetroMonsters.Utils.clamp(v2.x, 30, MetroMonsters.Constants.VIEWPORT.WIDTH - v2.width - 30);
            }
          } else {
            vehicleOverlapTimer = 0;
          }
        } else {
          vehicleOverlapTimer = 0;
        }
      }
      // Prevent Helicopters from stacking on top of each other!
      if (helicopters.length >= 2) {
        for (let i = 0; i < helicopters.length; i++) {
          for (let j = i + 1; j < helicopters.length; j++) {
            const h1 = helicopters[i];
            const h2 = helicopters[j];
            if (h1 && h2 && h1.alive && h2.alive && h1.hasEnteredScreen && h2.hasEnteredScreen) {
              const dx = (h1.x + h1.width / 2) - (h2.x + h2.width / 2);
              const dy = (h1.y + h1.height / 2) - (h2.y + h2.height / 2);
              const dist = Math.hypot(dx, dy);
              if (dist < 110) {
                const force = (110 - dist) * 0.05;
                const angle = Math.atan2(dy, dx) || (i % 2 === 0 ? 0.5 : -0.5);
                h1.x += Math.cos(angle) * force;
                h1.y += Math.sin(angle) * force;
                h2.x -= Math.cos(angle) * force;
                h2.y -= Math.sin(angle) * force;

                h1.y = MetroMonsters.Utils.clamp(h1.y, 60, 400);
                h2.y = MetroMonsters.Utils.clamp(h2.y, 60, 400);
              }
            }
          }
        }
      }

      helicopters.forEach(h => h.update(monsters));
      groundCivilians.forEach(c => c.update(monsters));
      groundCops.forEach(cop => cop.update(monsters));
      MetroMonsters.Audio.updateRotorSound(helicopters);

      // Update Arched Window Soldiers Dynamite Projectiles
      for (let i = dynamites.length - 1; i >= 0; i--) {
        const d = dynamites[i];
        d.x += d.vx;
        d.y += d.vy;
        d.vy += d.gravity;
        d.rotation += 0.2;

        monsters.forEach(m => {
          if (m && m.isAlive && d.alive) {
            if (Math.abs(m.x - d.x) < 32 && Math.abs((m.y - 30) - d.y) < 40) {
              d.alive = false;
              m.hp -= 10;
              MetroMonsters.VFX.spawnExplosion(d.x, d.y);
              MetroMonsters.VFX.spawnTextPopup(m.x, m.y - 30, "-10 HP DYNAMITE!", "#ff1744");
            }
          }
        });

        if (d.y >= MetroMonsters.Constants.VIEWPORT.ROAD_Y) {
          d.alive = false;
          MetroMonsters.VFX.spawnExplosion(d.x, MetroMonsters.Constants.VIEWPORT.ROAD_Y - 10);
        }

        if (!d.alive || d.x < 0 || d.x > MetroMonsters.Constants.VIEWPORT.WIDTH) {
          dynamites.splice(i, 1);
        }
      }

      // Update Fireball Projectiles
      for (let i = fireballs.length - 1; i >= 0; i--) {
        const fb = fireballs[i];
        fb.x += fb.vx;
        MetroMonsters.VFX.spawnDust(fb.x, fb.y, 1);

        // Check Fireball damaging buildings & vehicles
        const buildings = MetroMonsters.BuildingManager.getBuildings();
        buildings.forEach(b => {
          if (!b.isDestroyed && !b.isCollapsing) {
            if (fb.x >= b.x && fb.x <= b.x + b.width && fb.y >= b.y && fb.y <= b.y + b.height) {
              const relY = fb.y - b.y;
              const floor = Math.floor(relY / b.tileH);
              const col = Math.floor((fb.x - b.x) / b.tileW);
              b.damageTile(col, floor);
              fb.dead = true;
            }
          }
        });

        if (fb.dead || fb.x < 0 || fb.x > MetroMonsters.Constants.VIEWPORT.WIDTH) {
          fireballs.splice(i, 1);
        }
      }

      // Update Enemy Projectiles
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx;
        p.y += p.vy;

        monsters.forEach(m => {
          if (m && m.isAlive) {
            if (Math.abs(m.x - p.x) < 32 && Math.abs((m.y - 30) - p.y) < 40) {
              m.hp -= p.damage;
              MetroMonsters.VFX.spawnTextPopup(m.x, m.y - 30, `-${p.damage} HP`, "#ff1744");
              MetroMonsters.Audio.playExplosion();
              p.dead = true;
            }
          }
        });

        if (p.dead || p.x < 0 || p.x > MetroMonsters.Constants.VIEWPORT.WIDTH || p.y < 0 || p.y > MetroMonsters.Constants.VIEWPORT.ROAD_Y + 50) {
          projectiles.splice(i, 1);
        }
      }
    },
    render: (ctx) => {
      vehicles.forEach(v => v.render(ctx));
      helicopters.forEach(h => h.render(ctx));
      groundCivilians.forEach(c => c.render(ctx));
      groundCops.forEach(cop => cop.render(ctx));

      // Render Lit Arched Dynamite Sticks
      dynamites.forEach(d => {
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.rotate(d.rotation);
        ctx.fillStyle = "#dc2626";
        ctx.fillRect(-6, -3, 12, 6);
        ctx.fillStyle = "#ffff00";
        ctx.fillRect(6, -2, 3, 3);
        ctx.restore();
      });

      // Render Fireballs
      fireballs.forEach(fb => {
        ctx.fillStyle = "#ff4500";
        ctx.beginPath();
        ctx.arc(fb.x, fb.y, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffff00";
        ctx.beginPath();
        ctx.arc(fb.x, fb.y, 6, 0, Math.PI * 2);
        ctx.fill();
      });

      // Render Enemy Bullets
      projectiles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
        ctx.fill();
      });
    }
  });
})();

      });

      // Perfectly Fitted START GAME Button Banner (No Overflow!)

      ctx.strokeStyle = "#ffcc00";
      ctx.lineWidth = 3;
        ctx.strokeRect(240, 565, 800, 56);

      ctx.fillStyle = "#ffcc00";
      ctx.font = "bold 20px 'Courier New', monospace";
      ctx.fillText("PRESS [SPACE / ENTER] OR CLICK ANYWHERE TO START", MetroMonsters.Constants.VIEWPORT.WIDTH / 2, 600);
    },
    renderHUD: (ctx, p1, p2, currentStageIndex = 0) => {

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 20px 'Courier New', monospace";

          ctx.arc(bx + 34, roadY - 340 + sinkY, 12, 0, Math.PI * 2);

      // Championship Belt

      // Head & Face
      ctx.fillStyle = "#451a03"; ctx.beginPath(); ctx.arc(0, -100, 36, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#d97706"; ctx.beginPath(); ctx.arc(0, -95, 24, 0, Math.PI * 2); ctx.fill();
      // Big Cartoony Grin & Teeth
      ctx.fillStyle = "#0f172a"; ctx.beginPath(); ctx.arc(0, -90, 16, 0, Math.PI); ctx.fill();
      ctx.fillStyle = "#ffffff"; ctx.fillRect(-12, -90, 24, 6);
      // Eyes
      ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(-10, -108, 6, 0, Math.PI*2); ctx.arc(10, -108, 6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#000000"; ctx.beginPath(); ctx.arc(-9, -108, 2.5, 0, Math.PI*2); ctx.arc(11, -108, 2.5, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      // 2. CARTOON LIZ (Giant Lizard Flexing with Big Grin & Pink Tongue)
      ctx.save();
      ctx.translate(cx, my);
      // Lizard Body & Tail
      ctx.fillStyle = "#15803d";
      ctx.beginPath(); ctx.arc(0, -55, 46, 0, Math.PI * 2); ctx.fill();
      // Back Spikes
      ctx.fillStyle = "#eab308";
      ctx.beginPath(); ctx.moveTo(-20, -140); ctx.lineTo(0, -170); ctx.lineTo(20, -140); ctx.fill();
      // Flexed Bicep Arms
      ctx.fillStyle = "#16a34a";
      ctx.beginPath(); ctx.arc(-42, -80, 24, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(42, -80, 24, 0, Math.PI * 2); ctx.fill();
      // Championship Belt
      ctx.fillStyle = "#b45309"; ctx.fillRect(-36, -30, 72, 16);
      ctx.fillStyle = "#eab308"; ctx.fillRect(-12, -34, 24, 24);
      // Lizard Head & Snout
      ctx.fillStyle = "#16a34a"; ctx.beginPath(); ctx.arc(0, -105, 36, 0, Math.PI * 2); ctx.fill();
      // Huge Toothy Grin & Pink Tongue
      ctx.fillStyle = "#0f172a"; ctx.beginPath(); ctx.arc(0, -98, 20, 0, Math.PI); ctx.fill();
      ctx.fillStyle = "#f472b6"; ctx.beginPath(); ctx.arc(0, -88, 10, 0, Math.PI); ctx.fill();
      ctx.fillStyle = "#ffffff"; ctx.fillRect(-14, -98, 28, 5);
      // Eyes
      ctx.fillStyle = "#eab308"; ctx.beginPath(); ctx.arc(-11, -118, 8, 0, Math.PI*2); ctx.arc(11, -118, 8, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#000000"; ctx.beginPath(); ctx.arc(-10, -118, 3, 0, Math.PI*2); ctx.arc(12, -118, 3, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      ctx.beginPath(); ctx.moveTo(4, -92); ctx.lineTo(8, -84); ctx.lineTo(12, -92); ctx.fill();

        p1: MetroMonsters.Constants.ROSTER[rosterKeys[p1SelectIndex]],
