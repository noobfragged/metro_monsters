<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 64" width="128" height="64">
  <!-- 3D Shaded Military Ground Tank with Detailed Armored Turret -->
  <g id="military-tank-3d">
    <!-- Ground Shadow -->
    <ellipse cx="64" cy="58" rx="58" ry="5" fill="rgba(0,0,0,0.4)"/>
    
    <!-- Tread Armor Skirt & Treads Base -->
    <rect x="6" y="34" width="116" height="24" rx="12" fill="#142414" stroke="#081208" stroke-width="3"/>
    <!-- Tread Wheels -->
    <circle cx="22" cy="46" r="8" fill="#3a4a3a" stroke="#081208" stroke-width="2"/>
    <circle cx="43" cy="46" r="8" fill="#3a4a3a" stroke="#081208" stroke-width="2"/>
    <circle cx="64" cy="46" r="8" fill="#3a4a3a" stroke="#081208" stroke-width="2"/>
    <circle cx="85" cy="46" r="8" fill="#3a4a3a" stroke="#081208" stroke-width="2"/>
    <circle cx="106" cy="46" r="8" fill="#3a4a3a" stroke="#081208" stroke-width="2"/>
    <rect x="10" y="34" width="108" height="6" fill="#2d4a2d" stroke="#081208" stroke-width="1.5"/>

    <!-- Main Tank Chassis Hull (Sloped Armor) -->
    <polygon points="10,34 24,18 104,18 118,34" fill="#2d4a2d" stroke="#081208" stroke-width="3"/>
    <polygon points="24,18 104,18 100,26 28,26" fill="#3d623d"/>
    <rect x="28" y="26" width="72" height="8" fill="#243b24"/>

    <!-- 3D Armored Turret Dome with Beveled Layers -->
    <!-- Turret Base Ring -->
    <ellipse cx="60" cy="20" rx="30" ry="8" fill="#1b2e1b" stroke="#081208" stroke-width="2"/>
    <!-- Main Turret Body (Curved Front Armor) -->
    <path d="M 32 18 C 32 4, 88 4, 88 18 C 88 24, 32 24, 32 18 Z" fill="#3d623d" stroke="#081208" stroke-width="2.5"/>
    <!-- Turret Top Roof Panel -->
    <ellipse cx="60" cy="11" rx="22" ry="7" fill="#4d7a4d" stroke="#1b2e1b" stroke-width="1.5"/>
    
    <!-- Commander Hatch & Periscope -->
    <ellipse cx="46" cy="10" rx="6" ry="3" fill="#1b2e1b" stroke="#081208" stroke-width="1"/>
    <rect x="44" y="6" width="4" height="3" fill="#081208"/>

    <!-- Cannon Mantlet Armor Shield -->
    <rect x="76" y="8" width="12" height="14" rx="2" fill="#243b24" stroke="#081208" stroke-width="2"/>

    <!-- Long 120mm Heavy Cannon Barrel with Muzzle Brake -->
    <rect x="86" y="11" width="38" height="7" rx="1.5" fill="#142414" stroke="#081208" stroke-width="2"/>
    <rect x="88" y="12" width="34" height="2" fill="#2d4a2d"/>
    <!-- Muzzle Brake Slot -->
    <rect x="120" y="9" width="6" height="11" rx="1" fill="#081208"/>
    <rect x="122" y="11" width="2" height="7" fill="#f59e0b"/>
  </g>
</svg>
