<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64">
  <!-- Detailed Screaming Elder Gentleman SVG Sprite -->
  <g id="screaming-elder">
    <!-- Shadow -->
    <ellipse cx="24" cy="60" rx="16" ry="4" fill="rgba(0,0,0,0.35)"/>
    
    <!-- Beige Slacks & Brown Shoes -->
    <rect x="14" y="42" width="7" height="16" rx="3" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>
    <rect x="12" y="54" width="9" height="5" rx="2" fill="#451a03"/>

    <rect x="27" y="42" width="7" height="16" rx="3" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>
    <rect x="27" y="54" width="9" height="5" rx="2" fill="#451a03"/>

    <!-- Teal Knit Sweater Vest over Pink Shirt -->
    <rect x="11" y="22" width="26" height="22" rx="3" fill="#0d9488" stroke="#0f766e" stroke-width="2"/>
    <!-- Shirt Collar -->
    <polygon points="20,22 28,22 24,28" fill="#fbcfe8"/>

    <!-- Panicked Waving Arms Up -->
    <path d="M 12 24 L 4 12 L 8 10 L 15 22 Z" fill="#0d9488" stroke="#0f766e" stroke-width="1.5"/>
    <circle cx="5" cy="10" r="4" fill="#fbcfe8"/>

    <path d="M 36 24 L 44 12 L 40 10 L 33 22 Z" fill="#0d9488" stroke="#0f766e" stroke-width="1.5"/>
    <circle cx="43" cy="10" r="4" fill="#fbcfe8"/>

    <!-- Head & Screaming Face (Fair Peach Tone) -->
    <circle cx="24" cy="14" r="10" fill="#fbcfe8" stroke="#f472b6" stroke-width="1.5"/>
    <!-- Silver Platinum Hair -->
    <path d="M 14 12 Q 24 2 34 12 Q 24 8 14 12 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Glasses Frames -->
    <rect x="16" y="11" width="6" height="4" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="26" y="11" width="6" height="4" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="22" y1="13" x2="26" y2="13" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Wide Panicked Eyes -->
    <circle cx="19" cy="13" r="1.5" fill="#000000"/>
    <circle cx="29" cy="13" r="1.5" fill="#000000"/>

    <!-- Wide Open Screaming Mouth -->
    <ellipse cx="24" cy="18" rx="3.5" ry="4.5" fill="#7f1d1d" stroke="#000000" stroke-width="1"/>
    <rect x="22" y="14.5" width="4" height="1.5" fill="#ffffff"/>
  </g>
</svg>
