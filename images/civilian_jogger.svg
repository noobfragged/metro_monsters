<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64">
  <!-- Detailed Screaming Athlete Jogger SVG Sprite -->
  <g id="screaming-jogger">
    <!-- Shadow -->
    <ellipse cx="24" cy="60" rx="16" ry="4" fill="rgba(0,0,0,0.35)"/>
    
    <!-- Legs in Running Shorts & White Sneakers -->
    <rect x="14" y="40" width="7" height="16" rx="3" fill="#b87333" stroke="#a06635" stroke-width="1.5"/>
    <rect x="12" y="54" width="9" height="5" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>

    <rect x="27" y="40" width="7" height="16" rx="3" fill="#b87333" stroke="#a06635" stroke-width="1.5"/>
    <rect x="27" y="54" width="9" height="5" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>

    <!-- Red Athletic Tank Top & Grey Shorts -->
    <rect x="12" y="22" width="24" height="20" rx="3" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
    <rect x="12" y="36" width="24" height="7" rx="1" fill="#475569"/>

    <!-- Panicked Waving Arms Up -->
    <path d="M 12 24 L 4 12 L 8 10 L 15 22 Z" fill="#b87333" stroke="#a06635" stroke-width="1.5"/>
    <circle cx="5" cy="10" r="4" fill="#b87333"/>

    <path d="M 36 24 L 44 12 L 40 10 L 33 22 Z" fill="#b87333" stroke="#a06635" stroke-width="1.5"/>
    <circle cx="43" cy="10" r="4" fill="#b87333"/>

    <!-- Head & Screaming Face (Olive Bronze Tone) -->
    <circle cx="24" cy="14" r="10" fill="#b87333" stroke="#a06635" stroke-width="1.5"/>
    <!-- Blonde Hair with Sweatband -->
    <path d="M 14 12 Q 24 2 34 12 Q 24 8 14 12 Z" fill="#f59e0b"/>
    <rect x="12" y="10" width="24" height="3" rx="1" fill="#38bdf8"/>

    <!-- Wide Panicked Eyes -->
    <circle cx="20" cy="13" r="2.5" fill="#ffffff"/>
    <circle cx="20" cy="13" r="1" fill="#000000"/>
    <circle cx="28" cy="13" r="2.5" fill="#ffffff"/>
    <circle cx="28" cy="13" r="1" fill="#000000"/>

    <!-- Wide Open Screaming Mouth -->
    <ellipse cx="24" cy="18" rx="3.5" ry="4.5" fill="#7f1d1d" stroke="#000000" stroke-width="1"/>
    <rect x="22" y="14.5" width="4" height="1.5" fill="#ffffff"/>

    <!-- Sweat Drops -->
    <path d="M 34 8 Q 37 6 36 11 Z" fill="#38bdf8"/>
  </g>
</svg>
