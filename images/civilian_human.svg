<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64">
  <!-- Detailed Screaming Arcade Civilian Human -->
  <g id="screaming-civilian">
    <!-- Shadow -->
    <ellipse cx="24" cy="60" rx="16" ry="4" fill="rgba(0,0,0,0.35)"/>
    
    <!-- Left Leg (Blue Trousers) -->
    <rect x="14" y="42" width="7" height="16" rx="3" fill="#1e3a8a" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="12" y="54" width="9" height="5" rx="2" fill="#475569"/>

    <!-- Right Leg (Blue Trousers) -->
    <rect x="27" y="42" width="7" height="16" rx="3" fill="#1e3a8a" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="27" y="54" width="9" height="5" rx="2" fill="#475569"/>

    <!-- Business Suit Jacket (Cyan/Royal Blue) -->
    <path d="M 10 22 L 38 22 L 36 44 L 12 44 Z" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
    <!-- White Dress Shirt Trim & Red Tie -->
    <polygon points="21,22 27,22 24,32" fill="#ffffff"/>
    <polygon points="23,24 25,24 26,38 24,40 22,38" fill="#dc2626"/>

    <!-- Waving Screaming Arms (Left Arm Up) -->
    <path d="M 12 24 L 4 12 L 8 10 L 15 22 Z" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <circle cx="5" cy="10" r="4" fill="#fbcfe8"/>

    <!-- Right Arm Up in Panic -->
    <path d="M 36 24 L 44 12 L 40 10 L 33 22 Z" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <circle cx="43" cy="10" r="4" fill="#fbcfe8"/>

    <!-- Head & Screaming Face -->
    <circle cx="24" cy="14" r="10" fill="#fbcfe8" stroke="#f472b6" stroke-width="1.5"/>
    <!-- Brown Hair -->
    <path d="M 14 12 Q 24 2 34 12 Q 24 8 14 12 Z" fill="#78350f"/>

    <!-- Wide Panicked Eyes -->
    <circle cx="20" cy="13" r="2.5" fill="#ffffff"/>
    <circle cx="20" cy="13" r="1" fill="#000000"/>
    <circle cx="28" cy="13" r="2.5" fill="#ffffff"/>
    <circle cx="28" cy="13" r="1" fill="#000000"/>

    <!-- Wide Open Screaming Mouth -->
    <ellipse cx="24" cy="18" rx="3.5" ry="4.5" fill="#7f1d1d" stroke="#000000" stroke-width="1"/>
    <!-- Teeth -->
    <rect x="22" y="14.5" width="4" height="1.5" fill="#ffffff"/>

    <!-- Panic Sweat Drops -->
    <path d="M 34 8 Q 37 6 36 11 Z" fill="#38bdf8"/>
  </g>
</svg>
