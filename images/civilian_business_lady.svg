<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64">
  <!-- Detailed Screaming Executive Business Lady SVG Sprite -->
  <g id="screaming-business-lady">
    <!-- Shadow -->
    <ellipse cx="24" cy="60" rx="16" ry="4" fill="rgba(0,0,0,0.35)"/>
    
    <!-- Legs in Black High Heels -->
    <rect x="15" y="44" width="5" height="14" rx="2" fill="#5c3a21"/>
    <rect x="27" y="44" width="5" height="14" rx="2" fill="#5c3a21"/>
    <ellipse cx="17" cy="58" rx="4" ry="2" fill="#0f172a"/>
    <ellipse cx="29" cy="58" rx="4" ry="2" fill="#0f172a"/>

    <!-- Charcoal Suit Skirt & Navy Blazer -->
    <path d="M 12 22 L 36 22 L 38 44 L 10 44 Z" fill="#1e1b4b" stroke="#0f172a" stroke-width="2"/>
    <!-- Red Silk Blouse Collar Trim -->
    <polygon points="21,22 27,22 24,32" fill="#dc2626"/>

    <!-- Panicked Waving Arms Up -->
    <path d="M 12 24 L 4 12 L 8 10 L 15 22 Z" fill="#5c3a21" stroke="#3b2314" stroke-width="1.5"/>
    <circle cx="5" cy="10" r="3.5" fill="#5c3a21"/>

    <path d="M 36 24 L 44 12 L 40 10 L 33 22 Z" fill="#5c3a21" stroke="#3b2314" stroke-width="1.5"/>
    <circle cx="43" cy="10" r="3.5" fill="#5c3a21"/>

    <!-- Head & Screaming Face (Rich Bronze Tone) -->
    <circle cx="24" cy="14" r="10" fill="#5c3a21" stroke="#3b2314" stroke-width="1.5"/>
    <!-- Stylish Curly Black Hair -->
    <path d="M 12 12 Q 24 2 36 12 Q 40 22 36 28 M 12 28 Q 8 22 12 12 Z" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Wide Panicked Eyes -->
    <circle cx="20" cy="13" r="2.5" fill="#ffffff"/>
    <circle cx="20" cy="13" r="1" fill="#000000"/>
    <circle cx="28" cy="13" r="2.5" fill="#ffffff"/>
    <circle cx="28" cy="13" r="1" fill="#000000"/>

    <!-- Wide Open Screaming Mouth -->
    <ellipse cx="24" cy="18" rx="3.5" ry="4.5" fill="#7f1d1d" stroke="#000000" stroke-width="1"/>
    <rect x="22" y="14.5" width="4" height="1.5" fill="#ffffff"/>

    <!-- Sweat Drops -->
    <path d="M 34 8 Q 37 6 36 11 Z" fill="#38bdf8"/>
  </g>
</svg>
