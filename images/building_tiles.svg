<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Building Brick & Window Tilemap Sheet -->
  <defs>
    <!-- Intact Window -->
    <g id="window-intact">
      <rect x="8" y="8" width="48" height="48" rx="4" fill="#37474f" stroke="#263238" stroke-width="3"/>
      <rect x="14" y="14" width="36" height="36" fill="#80deea" stroke="#00acc1" stroke-width="2"/>
      <!-- Glass Glare -->
      <polygon points="16,16 36,16 16,36" fill="rgba(255,255,255,0.6)"/>
      <line x1="32" y1="14" x2="32" y2="50" stroke="#00acc1" stroke-width="2"/>
      <line x1="14" y1="32" x2="50" y2="32" stroke="#00acc1" stroke-width="2"/>
    </g>

    <!-- Broken Window -->
    <g id="window-broken">
      <rect x="8" y="8" width="48" height="48" rx="4" fill="#212121" stroke="#111" stroke-width="3"/>
      <!-- Glass Shards -->
      <polygon points="14,14 26,14 18,28" fill="#80deea"/>
      <polygon points="46,14 46,30 36,20" fill="#80deea"/>
      <polygon points="14,46 30,46 22,34" fill="#80deea"/>
      <polygon points="46,46 34,42 42,30" fill="#80deea"/>
    </g>

    <!-- Smashed Hole in Wall -->
    <g id="wall-hole">
      <rect x="4" y="4" width="56" height="56" fill="#121212"/>
      <path d="M 8 8 L 56 4 L 52 56 L 4 52 Z" fill="#000000"/>
      <!-- Jagged Concrete Edges -->
      <path d="M 4 4 L 16 12 L 8 28 L 20 40 L 6 60 L 58 54 L 46 36 L 56 18 L 44 6 Z" fill="none" stroke="#795548" stroke-width="4"/>
    </g>

    <!-- Brick Wall Segment -->
    <g id="brick-wall">
      <rect x="0" y="0" width="64" height="64" fill="#b71c1c" stroke="#5f0909" stroke-width="2"/>
      <!-- Brick mortar pattern -->
      <line x1="0" y1="16" x2="64" y2="16" stroke="#d32f2f" stroke-width="2"/>
      <line x1="0" y1="32" x2="64" y2="32" stroke="#d32f2f" stroke-width="2"/>
      <line x1="0" y1="48" x2="64" y2="48" stroke="#d32f2f" stroke-width="2"/>
      <line x1="32" y1="0" x2="32" y2="16" stroke="#d32f2f" stroke-width="2"/>
      <line x1="16" y1="16" x2="16" y2="32" stroke="#d32f2f" stroke-width="2"/>
      <line x1="48" y1="16" x2="48" y2="32" stroke="#d32f2f" stroke-width="2"/>
      <line x1="32" y1="32" x2="32" y2="48" stroke="#d32f2f" stroke-width="2"/>
      <line x1="16" y1="48" x2="16" y2="64" stroke="#d32f2f" stroke-width="2"/>
      <line x1="48" y1="48" x2="48" y2="64" stroke="#d32f2f" stroke-width="2"/>
    </g>
  </defs>

  <use href="#brick-wall" x="0" y="0"/>
  <use href="#window-intact" x="64" y="0"/>
  <use href="#window-broken" x="128" y="0"/>
  <use href="#wall-hole" x="192" y="0"/>
</svg>
