<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64">
  <!-- Detailed Screaming Arcade Civilian Lady in Pink Dress -->
  <g id="screaming-lady">
    <!-- Shadow -->
    <ellipse cx="24" cy="60" rx="16" ry="4" fill="rgba(0,0,0,0.35)"/>
    
    <!-- Legs in Heels -->
    <rect x="15" y="44" width="5" height="14" rx="2" fill="#fbcfe8"/>
    <rect x="27" y="44" width="5" height="14" rx="2" fill="#fbcfe8"/>
    <ellipse cx="17" cy="58" rx="4" ry="2" fill="#9d174d"/>
    <ellipse cx="29" cy="58" rx="4" ry="2" fill="#9d174d"/>

    <!-- Pink/Purple Dress -->
    <path d="M 12 22 L 36 22 L 40 44 L 8 44 Z" fill="#db2777" stroke="#9d174d" stroke-width="2"/>
    <!-- Yellow Belt / Ribbon -->
    <rect x="12" y="30" width="24" height="4" fill="#facc15"/>

    <!-- Panicked Waving Arms Up -->
    <path d="M 12 24 L 4 12 L 8 10 L 15 22 Z" fill="#fbcfe8" stroke="#f472b6" stroke-width="1.5"/>
    <circle cx="5" cy="10" r="3.5" fill="#fbcfe8"/>

    <path d="M 36 24 L 44 12 L 40 10 L 33 22 Z" fill="#fbcfe8" stroke="#f472b6" stroke-width="1.5"/>
    <circle cx="43" cy="10" r="3.5" fill="#fbcfe8"/>

    <!-- Head & Screaming Face -->
    <circle cx="24" cy="14" r="10" fill="#fbcfe8" stroke="#f472b6" stroke-width="1.5"/>
    <!-- Blonde Hair (Long Wavy Hair) -->
    <path d="M 12 12 Q 24 0 36 12 Q 38 24 34 28 M 14 28 Q 10 24 12 12 Z" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/>

    <!-- Wide Panicked Eyes -->
    <circle cx="20" cy="13" r="2.5" fill="#ffffff"/>
    <circle cx="20" cy="13" r="1" fill="#000000"/>
    <circle cx="28" cy="13" r="2.5" fill="#ffffff"/>
    <circle cx="28" cy="13" r="1" fill="#000000"/>

    <!-- Wide Open Screaming Mouth -->
    <ellipse cx="24" cy="18" rx="3.5" ry="4.5" fill="#7f1d1d" stroke="#000000" stroke-width="1"/>
    <rect x="22" y="14.5" width="4" height="1.5" fill="#ffffff"/>

    <!-- Sweat Drops -->
    <path d="M 34 8 Q 37 6 36 11 Z" fill="#38bdf8"/>
  </g>
</svg>
