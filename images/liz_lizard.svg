<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 112" width="96" height="112">
  <!-- Lizzie the Giant Lizard (Godzilla Style) -->
  <g id="lizzie-lizard">
    <ellipse cx="48" cy="106" rx="36" ry="6" fill="rgba(0,0,0,0.35)"/>
    <!-- Reptile Tail -->
    <path d="M 32 74 Q 8 86 4 100 Q 20 102 44 84 Z" fill="#1b5e20" stroke="#0a2a0c" stroke-width="2"/>
    <!-- Feet -->
    <ellipse cx="28" cy="100" rx="12" ry="6" fill="#1b5e20"/>
    <ellipse cx="68" cy="100" rx="12" ry="6" fill="#1b5e20"/>
    <polygon points="20,100 24,94 26,100" fill="#fff"/>
    <polygon points="60,100 64,94 66,100" fill="#fff"/>
    <!-- Torso -->
    <ellipse cx="48" cy="62" rx="32" ry="30" fill="#2e7d32" stroke="#0a2a0c" stroke-width="3"/>
    <!-- Scaled Underbelly (Yellow) -->
    <path d="M 36 46 C 36 40 60 40 60 46 C 60 66 54 74 48 74 C 42 74 36 66 36 46 Z" fill="#fbc02d" stroke="#2e7d32" stroke-width="2"/>
    <line x1="38" y1="52" x2="58" y2="52" stroke="#f57f17" stroke-width="2"/>
    <line x1="40" y1="60" x2="56" y2="60" stroke="#f57f17" stroke-width="2"/>
    <!-- Dorsal Spikes -->
    <polygon points="48,4 40,18 56,18" fill="#00e676" stroke="#0a2a0c" stroke-width="2"/>
    <polygon points="48,20 36,36 60,36" fill="#00e676" stroke="#0a2a0c" stroke-width="2"/>
    <polygon points="48,38 32,54 64,54" fill="#00e676" stroke="#0a2a0c" stroke-width="2"/>
    <!-- Arms & Claws -->
    <path d="M 20 44 Q 8 58 16 76" fill="none" stroke="#2e7d32" stroke-width="14" stroke-linecap="round"/>
    <path d="M 76 44 Q 88 58 80 76" fill="none" stroke="#2e7d32" stroke-width="14" stroke-linecap="round"/>
    <!-- Reptile Head -->
    <path d="M 28 26 Q 48 10 68 26 L 62 42 L 34 42 Z" fill="#2e7d32" stroke="#0a2a0c" stroke-width="3"/>
    <!-- Glowing Reptile Eyes -->
    <ellipse cx="38" cy="22" rx="4" ry="5" fill="#ff3d00"/>
    <line x1="38" y1="17" x2="38" y2="27" stroke="#000" stroke-width="2"/>
    <ellipse cx="58" cy="22" rx="4" ry="5" fill="#ff3d00"/>
    <line x1="58" y1="17" x2="58" y2="27" stroke="#000" stroke-width="2"/>
    <!-- Tooth Maw -->
    <path d="M 32 36 L 64 36 L 60 42 L 36 42 Z" fill="#b71c1c"/>
    <polygon points="34,36 36,40 38,36" fill="#ffffff"/>
    <polygon points="42,36 44,40 46,36" fill="#ffffff"/>
    <polygon points="50,36 52,40 54,36" fill="#ffffff"/>
    <polygon points="58,36 60,40 62,36" fill="#ffffff"/>
  </g>
</svg>
