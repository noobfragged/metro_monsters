<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 112" width="96" height="112">
  <!-- Ralph the Giant Werewolf (Wolfman Style) -->
  <g id="ralph-werewolf">
    <ellipse cx="48" cy="106" rx="36" ry="6" fill="rgba(0,0,0,0.35)"/>
    <!-- Wolf Legs -->
    <path d="M 28 72 L 18 90 L 12 100 L 32 100 Z" fill="#455a64" stroke="#1c313a" stroke-width="2"/>
    <path d="M 68 72 L 78 90 L 84 100 L 64 100 Z" fill="#455a64" stroke="#1c313a" stroke-width="2"/>
    <polygon points="10,100 14,94 16,100" fill="#cfd8dc"/>
    <polygon points="82,100 86,94 88,100" fill="#cfd8dc"/>
    <!-- Torso -->
    <ellipse cx="48" cy="60" rx="32" ry="28" fill="#546e7a" stroke="#1c313a" stroke-width="3"/>
    <!-- Chest Fur -->
    <path d="M 34 44 Q 48 36 62 44 Q 56 68 48 68 Q 40 68 34 44 Z" fill="#90a4ae" stroke="#37474f" stroke-width="2"/>
    <!-- Wolf Ears -->
    <polygon points="26,22 18,4 34,16" fill="#37474f" stroke="#1c313a" stroke-width="2"/>
    <polygon points="70,22 78,4 62,16" fill="#37474f" stroke="#1c313a" stroke-width="2"/>
    <!-- Wolf Arms -->
    <path d="M 20 42 Q 6 56 14 78" fill="none" stroke="#546e7a" stroke-width="14" stroke-linecap="round"/>
    <path d="M 76 42 Q 90 56 82 78" fill="none" stroke="#546e7a" stroke-width="14" stroke-linecap="round"/>
    <!-- Snout & Head -->
    <path d="M 32 20 L 64 20 L 58 38 L 38 38 Z" fill="#546e7a" stroke="#1c313a" stroke-width="3"/>
    <ellipse cx="48" cy="30" rx="10" ry="8" fill="#37474f"/>
    <polygon points="44,26 52,26 48,32" fill="#102027"/>
    <!-- Glowing Red Eyes -->
    <circle cx="36" cy="18" r="4" fill="#ff1744"/>
    <circle cx="36" cy="18" r="1.5" fill="#ffffff"/>
    <circle cx="60" cy="18" r="4" fill="#ff1744"/>
    <circle cx="60" cy="18" r="1.5" fill="#ffffff"/>
    <!-- Fanged Snarl -->
    <path d="M 38 34 Q 48 40 58 34 Z" fill="#4a148c"/>
    <polygon points="40,34 42,39 44,34" fill="#ffffff"/>
    <polygon points="52,34 54,39 56,34" fill="#ffffff"/>
  </g>
</svg>
