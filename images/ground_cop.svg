<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" width="64" height="96">
  <!-- Soft Drop Shadow -->
  <ellipse cx="32" cy="92" rx="20" ry="4" fill="rgba(0,0,0,0.35)"/>
  
  <!-- Legs & Trousers -->
  <rect x="20" y="56" width="10" height="32" fill="#172554" rx="2"/>
  <rect x="34" y="56" width="10" height="32" fill="#1e3a8a" rx="2"/>
  
  <!-- Leather Boots -->
  <rect x="18" y="84" width="13" height="10" fill="#0f172a" rx="3"/>
  <rect x="33" y="84" width="13" height="10" fill="#0f172a" rx="3"/>
  <rect x="18" y="90" width="14" height="4" fill="#334155" rx="1"/>
  <rect x="33" y="90" width="14" height="4" fill="#334155" rx="1"/>

  <!-- Duty Belt & Holster -->
  <rect x="16" y="50" width="32" height="7" fill="#0f172a" rx="2"/>
  <rect x="28" y="49" width="8" height="9" fill="#f59e0b" rx="1"/> <!-- Gold Buckle -->
  <rect x="29" y="50" width="6" height="7" fill="#d97706" rx="1"/>
  <rect x="40" y="53" width="7" height="12" fill="#1e293b" rx="2"/> <!-- Holster -->

  <!-- Police Jacket / Torso -->
  <path d="M16 26 Q32 24 48 26 L46 52 L18 52 Z" fill="#1e3a8a"/>
  <!-- Dark Shading Side -->
  <path d="M16 26 L24 26 L22 52 L18 52 Z" fill="#172554"/>
  <!-- Gold Buttons & Tie -->
  <rect x="30" y="28" width="4" height="22" fill="#0f172a"/> <!-- Tie -->
  <circle cx="26" cy="32" r="2" fill="#f59e0b"/>
  <circle cx="26" cy="40" r="2" fill="#f59e0b"/>
  <circle cx="26" cy="47" r="2" fill="#f59e0b"/>
  
  <!-- Metallic Gold Officer Badge -->
  <polygon points="38,30 43,27 46,32 42,37 38,34" fill="#fbbf24"/>
  <polygon points="39,31 42,28 45,32 42,36 39,33" fill="#f59e0b"/>

  <!-- Arms & Sleeves -->
  <rect x="10" y="26" width="8" height="24" fill="#1e3a8a" rx="3"/>
  <!-- Right Arm Aiming Handgun -->
  <path d="M46 26 L60 30 L58 38 L44 34 Z" fill="#1e3a8a"/>
  <!-- Officer Hands -->
  <circle cx="14" cy="50" r="4" fill="#fbcfe8"/>
  <circle cx="60" cy="34" r="4" fill="#fbcfe8"/>

  <!-- Handgun Pistol -->
  <rect x="58" y="30" width="14" height="6" fill="#0f172a" rx="1"/>
  <rect x="62" y="36" width="5" height="7" fill="#1e293b" rx="1"/>
  <circle cx="71" cy="33" r="2" fill="#f59e0b"/> <!-- Muzzle Glow -->

  <!-- Head & Face -->
  <rect x="24" y="16" width="16" height="14" fill="#fbcfe8" rx="3"/>
  <rect x="34" y="20" width="4" height="3" fill="#e11d48"/> <!-- Lips -->
  <circle cx="34" cy="19" r="2" fill="#0f172a"/> <!-- Eye -->

  <!-- Police Cap & Gold Shield -->
  <path d="M18 16 Q32 10 46 16 L48 10 Q32 4 16 10 Z" fill="#0f172a"/>
  <path d="M16 16 L48 16 L50 18 L14 18 Z" fill="#1e293b"/> <!-- Visor Cap Brim -->
  <polygon points="32,6 36,11 32,15 28,11" fill="#fbbf24"/> <!-- Cap Badge Shield -->
</svg>
